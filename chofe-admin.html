<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Chofè MsouWout — Konsòl</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* 1 Nov 2026 - Jennifer approves MsouWout drivers with HER console code.
   Approval used to need Jeffery's own MsouWout login + the code on his phone.
   Everything here goes through the HaitiBiznis server (console code checked
   there) to MsouWout, server to server. Every decision carries a name. */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:light;--navy:#0B2E6F;--red:#D21034;--green:#16803A;--gold:#E0A400;--ink:#152341;--muted:#5A6B8A;--line:#E2E8F0;--off:#F3F6FB}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--off);color:var(--ink);min-height:100vh}
button,input,select,textarea{font-family:inherit}
.flag{height:4px;background:linear-gradient(90deg,var(--navy) 50%,var(--red) 50%)}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}
.top b{font-size:1.05rem}.top small{color:var(--muted);display:block;font-size:.8rem}
.w{max-width:760px;margin:0 auto;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;background:#fff}
.mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.btn{min-height:44px;border:0;border-radius:10px;padding:10px 14px;font-weight:800;font-size:.9rem;cursor:pointer;background:var(--navy);color:#fff}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.o{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn:disabled{opacity:.55;cursor:default}
.full{width:100%;margin-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.dr .n{font-weight:800;font-size:1.02rem}
.st{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.st.pending{background:#FFF3D6;color:#8A5A00}.st.approved{background:#E2F4E8;color:#11632C}.st.rejected,.st.suspended{background:#FDE7EA;color:#A30F27}
.meta{font-size:.86rem;color:var(--muted);margin-top:8px;line-height:1.6}
.meta b{color:var(--ink)}
.ajan{margin-top:8px;font-size:.86rem;font-weight:700;border-radius:10px;padding:8px 10px}
.ajan.ok{background:#E2F4E8;color:#11632C}.ajan.no{background:#FFF3D6;color:#8A5A00}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts .btn{min-height:40px;padding:8px 12px;font-size:.84rem}
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.docs a{display:block;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700;text-align:center}
.docs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:3px}
.panel{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:4px}.panel.open{display:block}
.msg{font-size:.86rem;margin-top:8px;font-weight:700}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.counts{font-size:.85rem;color:var(--muted);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.counts .cn{background:#fff;border:1px solid #e3e3e3;border-radius:999px;padding:4px 10px;color:#333}
.counts .cn b{font-size:1rem;margin-left:3px}.counts .cf{border-color:#f0b429;background:#fff8e6}
.counts .ca{border-color:#9bd3a8}.counts .cr{border-color:#f2a7a7}
.hide{display:none}
/* 3 Nov 2026 (Jeffery): filters - status, missing document, vehicle, Ajan, search; counts on every chip */
.fbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.fbar .fl{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 11px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--ink);min-height:38px}
.chips button b{margin-left:4px;color:var(--muted)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}.chips button.on b{color:#fff}
.chips button.z{opacity:.45}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.frow select,.fbar input{min-height:42px;font-size:.88rem}
.fres{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-weight:800;font-size:.9rem}
.fres button{border:0;background:none;color:var(--red);font-weight:800;cursor:pointer;font-size:.85rem}
.iss{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}.iss span{font-size:.75rem;font-weight:800;border-radius:99px;padding:3px 9px;background:#FDE7EA;color:#A30F27}
.iss span.w{background:#FFF3D6;color:#8A5A00}.iss span.o{background:#FFE9D6;color:#9A4A00}.iss span.s{background:#E2F4E8;color:#11632C}
.st.oas{background:#FFE9D6;color:#9A4A00}
.fres .xp{display:flex;gap:6px;align-items:center}.fres .xp button{color:var(--navy)}
.xlog{font-size:.8rem;color:var(--muted);margin-top:6px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{background:#FFF8E1;border:1px solid #F2D27A;color:#5a4300;border-radius:12px;padding:10px 12px;font-size:.85rem;line-height:1.5;margin-bottom:12px}
.docs button{display:block;border:0;background:none;padding:0;color:var(--muted);font:inherit;font-size:.72rem;font-weight:700;text-align:center;cursor:pointer;width:100%}
.docs button img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:3px}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
#viewer.on{display:flex}#viewer .vs{width:100%;flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff;cursor:zoom-in}
#viewer .vs.z{display:block}#viewer .vs.z img{max-width:none;max-height:none;width:260%;cursor:zoom-out}
.fixb{background:#FFF3D6;color:#8A5A00;border-radius:10px;padding:8px 10px;font-weight:800;font-size:.85rem;margin-top:8px}
#viewer .vt{color:#fff;font-weight:800;margin:10px 0}#viewer .vb{display:flex;gap:10px}
#viewer button{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;background:#fff;color:#111}
</style>
</head>
<body>
<div class="flag"></div>
<div class="top"><div class="w" style="padding:0"><b>Chofè MsouWout — Konsòl</b><small>Verifye dokiman chofè yo, apwouve oswa rejte, epi mete Ajan ki rekrite yo. Sa w fè isit la ale touswit sou MsouWout.</small></div></div>

<div class="w">
  <div class="box" id="gate">
    <label for="pin">Kòd konsòl la</label>
    <input id="pin" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CONSOLE CODE">
    <label for="who">Non ou (li parèt sou chak desizyon)</label>
    <input id="who" autocomplete="name" placeholder="Egz: Jennifer">
    <button class="btn full" id="open">Louvri</button>
    <div class="msg err" id="gateMsg"></div>
  </div>

  <div id="main" class="hide">
    <div class="tabs" id="tabs">
      <button data-s="list" class="on">🛵 Chofè yo</button>
      <button data-s="stats">🏆 Ajan / Bonis</button>
      <button data-s="refunds">💸 Ranbousman</button>
      <button data-s="oavct">📄 OAVCT</button>
      <button data-s="train">🎓 Fòmasyon 30%</button>
    </div>
    <div class="counts" id="counts"></div>
    <div id="kolAlert"></div>
    <div id="mvNotif"></div>
    <div class="fbar" id="fbar">
      <input id="fq" type="search" placeholder="🔎 Chèche: non, telefòn, plak, badj Ajan (LMA-…)" autocomplete="off">
      <div class="fl">Estati</div><div class="chips" id="fSt"></div>
      <div class="fl">Dokiman ki manke / pou refè</div><div class="chips" id="fDoc"></div>
      <div class="frow"><select id="fVeh"></select><select id="fAj"></select></div>
      <select id="fSort" style="margin-top:8px">
        <option value="prio">Lòd: ⭐ manke OAVCT SÈLMAN an premye</option>
        <option value="new">Lòd: pi resan an premye</option><option value="old">Lòd: pi ansyen an premye</option>
        <option value="name">Lòd: non A → Z</option><option value="issues">Lòd: plis pwoblèm an premye</option></select>
      <div class="fres"><span id="fN"></span><span class="xp"><button type="button" id="fCsv">⬇️ CSV</button><button type="button" id="fXl">🕘</button><button type="button" id="fClr">✕ Retire filt yo</button></span></div>
      <div class="xlog hide" id="xLog"></div>
    </div>
    <div id="list"></div>
  </div>
</div>

<div id="viewer" role="dialog" aria-modal="true"><div class="vs" id="vS"><img id="vImg" alt=""></div><div class="vt" id="vName"></div><div class="vb"><button type="button" id="vP">◀</button><button type="button" id="vX">✕ Fèmen</button><button type="button" id="vN">▶</button></div><button type="button" id="vR" style="margin-top:10px;background:#00209F;color:#fff">📷 Ranplase foto sa a</button></div>
<script>
(function(){
  'use strict';
  var API = 'https://haitibiznis-api.onrender.com';
  var pin = '', who = '', cur = 'list', drivers = [];
  var F = { st: 'pending', doc: '', veh: '', aj: '', q: '', sort: 'prio' };
  try { var sf = JSON.parse(sessionStorage.getItem('hb_console_f') || 'null'); if (sf) F = Object.assign(F, sf); } catch(e){}
  if (F.st === 'oav') F.st = 'assist';   /* the old "Manke OAVCT" chip became part of 🟠 Asistans OAVCT (3 Nov) */
  function $(id){ return document.getElementById(id); }
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  try { who = localStorage.getItem('hb_console_who') || ''; } catch(e){}
  $('who').value = who;
  /* signed in for as long as this tab is open, so a reload does not send her back to the code screen */
  try { var sp = sessionStorage.getItem('hb_console_pin'); if (sp) { $('pin').value = sp; setTimeout(function(){ $('open').click(); }, 0); } } catch(e){}

  var ERR = { reference_required: 'Mete referans tranzaksyon an.', already_refunded: 'Ranbousman sa a deja anrejistre.', bad_amount: 'Montan an pa bon.', nothing_owed: 'Pa gen lajan pou remèt sou kous sa a.', new_photo_first: 'Mete foto nouvo OAVCT a anvan (bouton 📷 1), epi apre sa nouvo dat ki sou li a.',
    link_unavailable: 'Koneksyon ak MsouWout pa disponib pou kounye a. Eseye ankò nan yon minit.',
    name_required: 'Mete non ou anvan.', name_and_reason_required: 'Mete non ou ak rezon an.',
    name_and_code_required: 'Mete non ou ak kòd Ajan an.', code_not_found: 'Kòd Ajan sa a pa egziste nan sistèm Ajan an.',
    badge_not_active: 'Badj sa a pa aktif (oswa li pa gen kòd referans).', already_credited: 'Chofè sa a deja konte pou yon Ajan.',
    engine_unavailable: 'Sistèm Ajan an ap reveye. Eseye ankò nan yon minit.', not_found: 'Chofè a pa jwenn.',
    not_training: 'Se sèlman yon evènman Fòmasyon ki ka gen 30%.', htg_only: 'Fòmasyon an dwe vann an HTG.', nothing_to_change: 'Pa gen anyen pou chanje.',
    ticket_not_found: 'Tikè sa a pa egziste. Tcheke nimewo a (TL-…).', not_paid: 'Tikè sa a pa t peye: pa gen anyen pou ranbouse.',
    name_and_docs_required: 'Chwazi dokiman pou korije a.', name_and_date_required: 'Mete yon dat valab.', too_large: 'Foto a twò gwo.'
  };
  function req(method, path, body){
    var o = { method: method, headers: { 'x-admin-pin': pin } };
    if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
    return fetch(API + path, o).then(function(r){
      if (r.status === 403) { var e = new Error('Kòd konsòl la pa bon.'); e.pin = true; throw e; }
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) { var e = new Error(ERR[d.error] || d.error || ('Erè ' + r.status)); e.data = d; throw e; } return d;
      });
    });
  }

  $('open').onclick = function(){
    pin = $('pin').value.trim(); who = $('who').value.trim();
    if (!pin) return;
    if (!who) { $('gateMsg').textContent = 'Mete non ou.'; return; }
    try { localStorage.setItem('hb_console_who', who); } catch(e){}
    $('open').disabled = true; $('gateMsg').textContent = 'Ap louvri… (premye fwa a ka pran 1 minit)';
    load().then(function(){ $('gate').classList.add('hide'); $('main').classList.remove('hide'); try { sessionStorage.setItem('hb_console_pin', pin); } catch(e){} })
      .catch(function(e){ $('gateMsg').textContent = e.message; if (e.pin) { try { sessionStorage.removeItem('hb_console_pin'); } catch(x){} } })
      .then(function(){ $('open').disabled = false; });
  };
  document.querySelectorAll('#tabs button').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.toggle('on', x === b); });
      cur = b.getAttribute('data-s'); $('list').innerHTML = '<div class="box">Ap chaje…</div>';
      $('fbar').classList.toggle('hide', cur !== 'list');
      (cur === 'stats' ? loadStats() : cur === 'refunds' ? loadRefunds() : cur === 'oavct' ? loadOavct() : cur === 'train' ? loadTrain() : load()).catch(function(e){ $('list').innerHTML = '<div class="box msg err">' + esc(e.message) + '</div>'; });
    };
  });

  var SVC = { ride: '🚕 Kous', delivery: '📦 Livrezon', both: '🚕 Kous + 📦 Livrezon' };
  function whoLabel(b){ b = String(b || ''); return b.indexOf('ajan:') === 0 ? 'Ajan ' + b.slice(5) : b.indexOf('console:') === 0 ? b.slice(8) : b; }
  var DL = { selfie: 'Foto figi', id: 'Kat ID', license: 'Lisans', oavct: 'OAVCT', vehicle: 'Machin/Moto', insurance: 'Asirans' };
  function reqMiss(d){ var h = d.doc_types || []; return NEED.filter(function(t){ return h.indexOf(t) < 0; }); }
  var NEED = ['selfie', 'license', 'oavct', 'vehicle'], ORD_ALL = ['selfie', 'id', 'license', 'oavct', 'vehicle', 'insurance'];   /* 3 Nov: ID optional */
  /* a photo Jennifer picks to replace one (Ajan sent it on WhatsApp): same size as the forms send */
  function shrink(file){ return new Promise(function(res){ var u = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.85)); };
    im.onerror = function(){ URL.revokeObjectURL(u); res(null); }; im.src = u; }); }
  var VEH = { motorcycle: '🛵 Moto', moto: '🛵 Moto', car: '🚗 Machin' };
  function fmt(d){ try { return new Date(d).toLocaleString('fr-HT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch(e){ return ''; } }

  /* 4 Nov 2026: MyPlopPlop businesses waiting for Jennifer - shown here too, so she never misses one */
  var mvAt = 0;
  function mvNotify(){
    if (Date.now() - mvAt < 120000) return; mvAt = Date.now();
    req('GET', '/api/agents/admin/merchants').then(function(d){
      var n = ((d && d.counts) || {}).pending || 0;
      $('mvNotif').innerHTML = n ? '<a href="machann-admin.html" style="display:block;text-decoration:none;color:#8A5A00;background:#fff8e6;border:2px solid #f0b429;border-radius:12px;padding:10px 12px;font-weight:800;margin-bottom:10px">🔔 ' + n + ' biznis MyPlopPlop ap tann apwobasyon ou → machann-admin</a>' : '';
    }).catch(function(){});
  }
  /* ═══ 6 Nov 2026, Jeffery (Koli option A): "Add the 15-minute alert for Jennifer". A PAID package with no driver for
     15 minutes shows here in red, on every tab, refreshed every minute: how long it has waited, how long before the
     automatic refund (30 min), the sender, and the nearest drivers to call. The server has already widened the search. */
  var kolTimer = null;
  function kolNotify(){
    if (!pin) return;
    req('GET', '/api/agents/admin/parcels-waiting').then(function(d){
      var red = (d.waiting || []).filter(function(x){ return x.alert; });
      if (!red.length) { $('kolAlert').innerHTML = ''; return; }
      $('kolAlert').innerHTML = '<div style="background:#FDECEC;border:2px solid #D21034;border-radius:12px;padding:10px 12px;margin-bottom:10px;color:#7A0A1E">' +
        '<div style="font-weight:900;font-size:1rem">🚨 ' + red.length + ' KOLI SAN CHOFÈ DEPI ' + d.alertAfter + ' MINIT</div>' +
        '<div style="font-size:.82rem;margin:2px 0 6px">Sistèm nan voye l ankò bay tout chofè ki kalifye, epi li chèche pi lwen SÈLMAN nan zòn operasyon apwouve yo (zòn vèt MsouWout, nan lè yo louvri). Rele yon chofè: si pèsonn pa pran l nan ' + d.refundAfter + ' minit, koli a anile e moun nan dwe ranbouse.</div>' +
        red.map(function(k){
          var ph = String(k.sender.phone || ''), wa = ph.replace(/\D/g, '');
          return '<div style="background:#fff;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:.84rem;line-height:1.5;color:#1B2340">' +
            '<div style="display:flex;justify-content:space-between;gap:6px"><b>📦 Koli ' + esc(k.short) + ' · ' + Number(k.amount || 0).toLocaleString('fr-FR') + ' HTG</b><b style="color:#D21034">⏱ ' + esc(k.minutes) + ' min · ranbou nan ' + esc(k.refundIn) + ' min</b></div>' +
            '📍 ' + esc(k.pickup || '') + ' → ' + esc(k.dropoff || '') + '<br>' + (k.pickupArea ? '🟢 Zòn: ' + esc(k.pickupArea) : '⚪ Pa nan yon zòn apwouve (oswa zòn nan fèmen kounye a): chofè nan ' + esc(d.normalKm) + ' km sèlman') + '<br>👤 ' + esc(k.sender.name || '') + (ph ? ' · <a href="tel:' + esc(ph) + '">' + esc(ph) + '</a> · <a target="_blank" rel="noopener" href="https://wa.me/' + esc(wa) + '">WhatsApp</a>' : '') +
            '<div style="margin-top:4px"><b>Chofè ki pi pre yo:</b>' + (k.drivers.length ? k.drivers.map(function(v){
              return '<br>' + (v.online ? (v.busy ? '🟠' : '🟢') : '⚪') + ' ' + esc(v.name) + ' · ' + esc(v.km) + ' km · <a href="tel:' + esc(v.phone) + '">' + esc(v.phone) + '</a>' +
                (v.online ? (v.busy ? ' · okipe' : ' · an liy') : ' · pa an liy');
            }).join('') : '<br>Pa gen chofè ki kalifye pou koli sa a kounye a.') + '</div></div>';
        }).join('') + '</div>';
    }).catch(function(){});
  }
  function load(){
    mvNotify(); kolNotify(); if (!kolTimer) kolTimer = setInterval(kolNotify, 60000);
    /* every driver once (≤300), then filtered here - so every count is the server's list, never a guess */
    return req('GET', '/api/agents/admin/drivers?status=all').then(function(d){
      drivers = d.drivers || [];
      /* Jeffery 3 Nov: pending · correction requested · approved · rejected → the status chips (same server list) */
      $('counts').innerHTML = '';
      render();
    });
  }
  /* the driver hears the decision: a WhatsApp message ready to send from her phone */
  /* Jeffery's welcome text, 2 Nov 2026 (the same as the server sends). ⛔ Never "you can take rides now". */
  var MSG_OK = '🎉 FELISITASYON! BYENVINI NAN MSOUWOUT!\n\nBonjou {n}! Nou kontan fè w konnen enskripsyon w kòm chofè MsouWout apwouve. ✅\n\n'
    + '📲 Telechaje aplikasyon MsouWout la, antre nimewo telefòn ou epi kreye PIN 4 chif ou.\n\n'
    + '🎓 MSOUWOUT AP ÒGANIZE YON FÒMASYON GRATIS POU OU!\n\n'
    + 'Nou pral montre w kijan pou itilize aplikasyon MsouWout ak MyPlopPlop yo pi byen, kijan pou resevwa ak jere kous ak livrezon, epi kijan pou travay an sekirite ak pwofesyonalis.\n\n'
    + '📅 N ap kontakte w pou ba w dat, lè ak kote fòmasyon an ap fèt.\n\n🚀 Gwo lansman an ap vini byento!\n\nMsouWout — Chofè Verifye. Kous An Sekirite.';
  /* where the welcome stands, on every approved driver */
  function welLine(d){
    if (d.status !== 'approved') return '';

  /* ═══ 5 Nov 2026: KOLI REFUNDS. A paid parcel nobody took within 30 minutes, or that the sender cancelled
     before pickup, is a refund OWED. Pay it back (MonCash/NatCash/card), then record who + the reference. */
  var RF = 'owed';
  var RWHY = { no_driver: 'Pa gen chofè ki te pran l (30 min)', sender_cancelled: 'Moun nan anile l anvan yo pran l', paid_after_cancel: 'Peye APRE li te anile' };
  function loadRefunds(){
    $('counts').textContent = '';
    return req('GET', '/api/agents/admin/parcel-refunds?status=' + RF).then(function(d){
      var rows = d.refunds || [], owed = d.owed || { count: 0, total: 0 };
      var chips = ['owed', 'refunded', 'all'].map(function(k){ return '<button type="button" class="' + (k === RF ? 'on' : '') + '" data-rf="' + k + '">' +
        ({ owed: '⏳ Pou ranbouse', refunded: '✅ Ranbouse', all: '📋 Tout' })[k] + '</button>'; }).join('');
      $('list').innerHTML = '<div class="note">Koli ki te peye men ki p ap livre: lajan an dwe remèt moun ki te voye l la. Voye l ak MonCash/NatCash (oswa kat), epi mete referans tranzaksyon an isit la. ' +
          '<b>' + owed.count + ' pou ranbouse · ' + Number(owed.total || 0).toLocaleString('fr-FR') + ' HTG</b></div>' +
        '<div class="chips" id="rfChips" style="margin:8px 0">' + chips + '</div>' +
        (rows.length ? rows.map(function(r, i){
          var ph = String(r.sender && r.sender.phone || ''), wa = ph.replace(/\D/g, '');
          var pays = (r.payments || []).map(function(p){ return esc(String(p.method || '').toUpperCase()) + ' ' + esc(p.amount) + ' HTG · ref <span class="mono">' + esc(p.reference || '—') + '</span>'; }).join('<br>');
          return '<div class="box" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>Koli ' + esc(r.short) + '</b>' +
              '<b style="color:' + (r.status === 'owed' ? '#B45309' : '#12A150') + '">' + Number(r.amount || 0).toLocaleString('fr-FR') + ' HTG</b></div>' +
            '<div style="font-size:.86rem;margin-top:6px;line-height:1.5">' + esc(RWHY[r.reason] || r.reason || '') + '<br>' +
              '👤 ' + esc(r.sender && r.sender.name || '') + (ph ? ' · <a href="tel:' + esc(ph) + '">' + esc(ph) + '</a> · <a target="_blank" rel="noopener" href="https://wa.me/' + esc(wa) + '">WhatsApp</a>' : '') + '<br>' +
              '💳 Te peye: ' + (pays || esc(r.method || '')) + '<br>📍 ' + esc(r.pickup || '') + ' → ' + esc(r.dropoff || '') + '<br>' +
              '🕘 ' + esc(r.owedAt ? new Date(r.owedAt).toLocaleString('fr-FR') : '') + '</div>' +
            (r.status === 'owed'
              ? '<input id="rfRef' + i + '" class="mono" placeholder="Referans tranzaksyon ranbousman an" style="margin-top:8px"><input id="rfNote' + i + '" placeholder="Nòt (opsyonèl)" style="margin-top:6px">' +
                '<button class="btn full" id="rfGo' + i + '" style="margin-top:8px">✅ Mwen ranbouse l</button><div class="msg" id="rfMsg' + i + '"></div>'
              : '<div class="msg ok" style="margin-top:6px">✅ Ranbouse pa ' + esc(r.by || '') + ' · ref <span class="mono">' + esc(r.reference || '') + '</span>' +
                (r.refundedAt ? ' · ' + esc(new Date(r.refundedAt).toLocaleString('fr-FR')) : '') + (r.note ? '<br>' + esc(r.note) : '') + '</div>') +

        }).join('') : '<div class="box">Pa gen anyen isit la.</div>');
      document.querySelectorAll('#rfChips button').forEach(function(b){ b.onclick = function(){ RF = b.getAttribute('data-rf'); loadRefunds().catch(function(e){ $('list').innerHTML = '<div class="box msg err">' + esc(e.message) + '</div>'; }); }; });

  /* ═══ 6 Nov 2026, Jeffery: "Handle refunds by reversing unpaid or pending commissions." A Tikè Lakay ticket:
     send the money back first, then record it here with the reference. The ticket stops opening the door, its
     place goes back on sale, and the Ajan commission not yet paid on it is cancelled automatically. */
  function loadTicketRefund(){
    var box = document.createElement('div'); box.id = 'ticketRefund'; $('list').appendChild(box);
    box.innerHTML = '<h3 style="margin:20px 0 6px">🎟️ Tikè Lakay</h3>' +

                '<br>📞 <a href="tel:' + esc(r.phone || '') + '">' + esc(r.phone || '') + '</a>' + (wa ? ' · <a target="_blank" rel="noopener" href="https://wa.me/' + esc(wa) + '?text=' + encodeURIComponent(txt) + '">💬 WhatsApp (mesaj pare)</a>' : '') +
                (r.ajan ? '<br>🪪 Ajan: <span class="mono">' + esc(r.ajan) + '</span>' : '') +
                (r.new_photo ? '<br><b style="color:#0B6B37">📷 Nouvo foto OAVCT resevwa ' + esc(fmt(r.photo_at)) + (r.photo_by ? ' (' + esc(whoLabel(r.photo_by)) + ')' : '') + ': verifye l, epi mete nouvo dat la.</b>' : '') + '</div>' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn o" data-ovp="' + i + '">📷 1. Nouvo foto OAVCT</button></div>' +
              '<div style="display:flex;gap:8px;margin-top:8px"><input type="date" id="ovd' + i + '" style="flex:1"><button class="btn" data-ovs="' + i + '">📅 2. Sere nouvo dat la</button></div>' +
              '<div class="msg" id="ovm' + i + '"></div></div>';
          }).join('') : '<div class="box">Pa gen pèsonn.</div>');
      };
      $('list').innerHTML = '<div class="note">Sistèm nan <b>bloke otomatikman</b> nouvo kous ak livrezon pou yon chofè apwouve lè OAVCT li ekspire (kous li deja genyen an kontinye). Li resevwa yon notifikasyon 30, 7 ak 1 jou anvan, epi lè l bloke. ' +
          'Pou debloke l: <b>1)</b> mete foto nouvo OAVCT la, <b>2)</b> mete nouvo dat ki ekri sou li a. Li ka travay ankò touswit.</div>' +
        sec('⛔ Bloke: OAVCT ekspire', '', d.held || [], '#B91C1C') +
        sec('⚠️ Ap ekspire nan 30 jou', 'Voye yon ti mesaj bay yo kounye a pou yo renouvle bonè.', d.soon || [], '#B45309') +
        sec('❔ Pa gen dat OAVCT', 'Chofè apwouve sa yo pa gen dat OAVCT nan sistèm nan, kidonk sistèm nan pa ka bloke yo lè l ekspire. Mete dat ki sou foto a.', d.missing || [], '#475569');
      document.querySelectorAll('[data-ovp]').forEach(function(b){ b.onclick = function(){
        var i = +b.getAttribute('data-ovp'), r = OV[i], m = $('ovm' + i), f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
        f.onchange = function(){ var file = f.files && f.files[0]; if (!file) return; m.className = 'msg ok'; m.textContent = 'Ap voye foto a…';
          shrink(file).then(function(u){ if (!u) throw new Error('Foto a pa bon.');
            return req('POST', '/api/agents/admin/drivers/' + r.id + '/document', { by: who, doc_type: 'oavct', image_data: u }); })
            .then(function(){ m.className = 'msg ok'; m.textContent = '✅ Foto OAVCT la anrejistre. Kounye a mete nouvo dat la.'; })
            .catch(function(e){ m.className = 'msg err'; m.textContent = e.message; }); };
        f.click(); }; });
      document.querySelectorAll('[data-ovs]').forEach(function(b){ b.onclick = function(){
        var i = +b.getAttribute('data-ovs'), r = OV[i], m = $('ovm' + i), v = $('ovd' + i).value;
        if (!v) { m.className = 'msg err'; m.textContent = 'Chwazi dat ki ekri sou OAVCT la.'; return; }
        b.disabled = true;
        req('POST', '/api/agents/admin/drivers/' + r.id + '/oavct', { by: who, expiry: v })
          .then(function(){ m.className = 'msg ok'; m.textContent = '✅ Nouvo dat la anrejistre.'; setTimeout(function(){ loadOavct().catch(function(){}); }, 900); })
          .catch(function(e){ b.disabled = false; m.className = 'msg err'; m.textContent = e.message; }); }; });
    });
  }

  function loadStats(){
    $('counts').textContent = '';
    return req('GET', '/api/agents/admin/drivers/stats').then(function(s){
      var rows = s.agents || [];
      $('list').innerHTML = '<div class="note">Chofè ki konte pou chak Ajan. "Verifye" = chofè ki APWOUVE. Bonis: 1 000 HTG pou chak 5 chofè verifye (règ Jeffery a). Sa a se yon kalkil pou swiv sèlman: sistèm nan pa peye pèsonn otomatikman.</div>' +
        (s.uncredited ? '<div class="note">⚠️ ' + s.uncredited + ' chofè (an atant oswa apwouve) poko konte pou okenn Ajan. Ale nan "An atant" / "Apwouve" → "🪪 Mete Ajan an".</div>' : '') +
        '<div class="box" style="padding:8px 10px;overflow-x:auto"><table><thead><tr><th>Ajan</th><th class="num">Enskri</th><th class="num">Verifye</th><th class="num">Bonis (HTG)</th><th class="num">Pou pwochen bonis</th></tr></thead><tbody>' +
        (rows.length ? rows.map(function(r){
          return '<tr><td><b>' + esc(r.name || '—') + '</b><br><span class="mono" style="font-size:.78rem;color:var(--muted)">' + esc(r.agentId || '') + ' ' + esc(r.code) + '</span></td>' +
            '<td class="num">' + r.registered + '</td><td class="num"><b>' + r.verified + '</b></td><td class="num">' + r.bonusHtg.toLocaleString('fr-FR') + '</td><td class="num">' + r.toNext + ' chofè</td></tr>';
        }).join('') : '<tr><td colspan="5">Poko gen chofè ki konte pou yon Ajan.</td></tr>') + '</tbody></table></div>';
    });
  }
})();
</script>
</body>
</html>
