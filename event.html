<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#00209F;--blue-deep:#001566;--blue-light:#0A3ACC;
  --red:#D21034;--red-dark:#B00D2C;--red-glow:rgba(210,16,52,.15);
  --gold:#D4A017;--gold-light:#E8B82E;--gold-soft:#FDF3D7;--gold-glow:rgba(212,160,23,.2);
  --green:#1B8C3D;--green-light:#E8F5E9;
  --white:#FFFFFF;--off-white:#F5F7FA;--cream:#FAFBFD;
  --dark:#0A0E1A;--text:#1A2A4A;--text-light:#5A6B8A;--text-muted:#8A95AA;
  --border:#E2E8F0;--border-light:#F0F3F7;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --shadow-sm:0 1px 3px rgba(10,14,26,.06);
  --shadow-md:0 4px 16px rgba(10,14,26,.08);
  --shadow-lg:0 12px 40px rgba(10,14,26,.12);
  --radius:14px;--radius-lg:20px;
}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--off-white);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-bottom:56px}
a{text-decoration:none;color:inherit}
button{font-family:var(--body);cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}

/* FLAG */
.flag-stripe{height:4px;background:linear-gradient(90deg,var(--blue) 50%,var(--red) 50%);position:relative;z-index:1002}

/* HEADER */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-left{display:flex;align-items:center;gap:10px}
.header-left img{height:30px;border-radius:5px}
.header-left span{font-family:var(--display);font-size:1rem;color:var(--dark)}
.header-left span em{color:var(--red);font-style:italic}
.header-back{
  display:flex;align-items:center;gap:6px;
  font-size:.78rem;font-weight:600;color:var(--text-light);
  padding:8px 14px;border-radius:10px;border:1px solid var(--border);
  transition:all .2s;
}
.header-back:hover{background:var(--off-white);border-color:var(--text-muted);color:var(--blue)}
.header-back svg{width:16px;height:16px}

/* HERO IMAGE */
.hero-invite{
  width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--dark) 0%,#0A1235 30%,var(--blue-deep) 55%,var(--blue) 80%,var(--gold) 100%);
}
.hero-invite::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 500px 300px at 20% 80%, rgba(212,160,23,.15) 0%, transparent 70%),
    radial-gradient(ellipse 400px 400px at 80% 20%, rgba(0,32,159,.2) 0%, transparent 70%);
  pointer-events:none;
}
.hero-invite::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 30%, rgba(10,14,26,.7) 100%);
  pointer-events:none;
}
.hero-grid{
  position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 80px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 1px, transparent 1px, transparent 80px);
  pointer-events:none;
}
.hero-content{
  position:absolute;bottom:0;left:0;right:0;padding:20px 16px 18px;
  z-index:2;color:#fff;
}
.hero-type-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 12px;border-radius:6px;
  background:rgba(0,32,159,.85);backdrop-filter:blur(6px);
  color:#fff;margin-bottom:10px;
}
.hero-title{
  font-family:var(--display);font-size:clamp(1.5rem,5vw,2.2rem);
  line-height:1.15;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,.4);
}
.hero-date-loc{
  display:flex;flex-direction:column;gap:4px;font-size:.82rem;
  color:rgba(255,255,255,.8);
}
.hero-date-loc span{display:flex;align-items:center;gap:6px}
.hero-date-loc svg{width:14px;height:14px;flex-shrink:0;opacity:.7}
.hero-hosted{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;padding:5px 12px;border-radius:100px;
  background:rgba(255,255,255,.12);backdrop-filter:blur(8px);
  font-size:.72rem;font-weight:600;color:rgba(255,255,255,.85);
}

/* MAIN */
.main{max-width:640px;margin:0 auto;padding:0 16px 24px}

/* CARD */
.card{
  background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px;margin-top:16px;
  box-shadow:var(--shadow-sm);
}
.card-title{
  font-family:var(--display);font-size:1.15rem;color:var(--dark);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.card-title .icon{font-size:1.15rem}

/* EVENT INFO */
.info-rows{display:flex;flex-direction:column;gap:12px}
.info-row{display:flex;align-items:flex-start;gap:12px}
.info-icon{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.info-icon svg{width:18px;height:18px}
.info-icon.blue{background:rgba(0,32,159,.08);color:var(--blue)}
.info-icon.red{background:rgba(210,16,52,.08);color:var(--red)}
.info-icon.green{background:rgba(27,140,61,.08);color:var(--green)}
.info-icon.gold{background:rgba(212,160,23,.1);color:#8B6914}
.info-text{flex:1;min-width:0}
.info-text .label{font-size:.72rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.info-text .value{font-size:.9rem;font-weight:600;color:var(--text);margin-top:1px}
.info-text .value a{color:var(--blue);text-decoration:underline;text-decoration-color:rgba(0,32,159,.25)}

/* EVENT TYPE BADGE (in info card) */
.event-type-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 14px;border-radius:100px;
  font-size:.75rem;font-weight:700;
  background:rgba(0,32,159,.08);color:var(--blue);
  margin-top:4px;
}

/* SHARE BUTTONS */
.share-row{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-light)}
.share-btn{
  height:38px;padding:0 14px;border-radius:10px;font-size:.75rem;font-weight:700;
  display:flex;align-items:center;gap:6px;transition:all .2s;flex:1;justify-content:center;
}
.share-btn svg{width:16px;height:16px;flex-shrink:0}
.share-btn.wa{background:#25D366;color:#fff}
.share-btn.wa:hover{background:#1DA851}
.share-btn.fb{background:#1877F2;color:#fff}
.share-btn.fb:hover{background:#1466D8}
.share-btn.copy{background:var(--off-white);color:var(--text);border:1px solid var(--border)}
.share-btn.copy:hover{background:var(--border-light);border-color:var(--text-muted)}
.share-btn.email{background:#EA4335;color:#fff}
.share-btn.email:hover{background:#D33426}

/* DESCRIPTION */
.desc-text{font-size:.88rem;color:var(--text-light);line-height:1.7;white-space:pre-line}
.desc-text.collapsed{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;
}
.read-more-btn{
  display:inline-flex;align-items:center;gap:4px;
  margin-top:10px;font-size:.82rem;font-weight:700;color:var(--blue);
  padding:6px 0;transition:color .2s;
}
.read-more-btn:hover{color:var(--blue-light)}
.read-more-btn svg{width:14px;height:14px;transition:transform .2s}
.read-more-btn.expanded svg{transform:rotate(180deg)}

/* TICKETS */
.ticket-option{
  border:2px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;transition:all .25s;cursor:pointer;
  position:relative;overflow:hidden;
}
.ticket-option:hover{border-color:var(--blue-light);box-shadow:var(--shadow-sm)}
.ticket-option.selected{border-color:var(--blue);background:rgba(0,32,159,.02);box-shadow:0 0 0 3px rgba(0,32,159,.08)}
.ticket-option.selected::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--blue-light));
}
.ticket-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
.ticket-name{font-size:.92rem;font-weight:700;color:var(--dark)}
.ticket-price{
  font-size:1rem;font-weight:800;color:var(--dark);white-space:nowrap;
  display:flex;align-items:baseline;gap:3px;
}
.ticket-price .currency{font-size:.72rem;font-weight:600;color:var(--text-muted)}
.ticket-price.free{color:var(--green);font-size:.88rem}
.ticket-desc{font-size:.78rem;color:var(--text-light);margin-bottom:10px;line-height:1.4}
.ticket-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket-avail{
  display:flex;align-items:center;gap:5px;
  font-size:.7rem;font-weight:600;color:var(--text-muted);
}
.ticket-avail .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.ticket-avail.low .dot{background:var(--gold)}
.ticket-avail.low{color:#8B6914}
.ticket-avail.soldout .dot{background:var(--red)}
.ticket-avail.soldout{color:var(--red)}
.qty-selector{
  display:flex;align-items:center;gap:0;
  border:1.5px solid var(--border);border-radius:10px;overflow:hidden;
  height:36px;
}
.qty-btn{
  width:36px;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:700;color:var(--text-light);
  transition:all .15s;background:var(--off-white);
}
.qty-btn:hover{background:var(--border-light);color:var(--blue)}
.qty-btn:active{background:var(--border)}
.qty-val{
  width:36px;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:.88rem;font-weight:800;color:var(--dark);
  border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);
  background:var(--white);
}

/* STICKY BOTTOM BAR */
.order-bar{
  position:fixed;bottom:56px;left:0;right:0;z-index:90;
  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transform:translateY(100%);opacity:0;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.order-bar.visible{transform:translateY(0);opacity:1;pointer-events:auto}
.order-info{display:flex;flex-direction:column;gap:2px}
.order-count{font-size:.75rem;font-weight:600;color:var(--text-light)}
.order-total{font-size:1.1rem;font-weight:800;color:var(--dark)}
.order-total .currency{font-size:.78rem;font-weight:600;color:var(--text-muted)}
.buy-btn{
  height:48px;padding:0 28px;border-radius:12px;
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  color:#fff;font-size:.92rem;font-weight:800;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(210,16,52,.35);
  transition:all .25s;white-space:nowrap;
}
.buy-btn svg{width:18px;height:18px;flex-shrink:0}
.buy-btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(210,16,52,.45)}
.buy-btn:active{transform:translateY(0)}

/* ORGANIZER */
.org-row{display:flex;align-items:center;gap:14px}
.org-avatar{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--blue-light));
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;font-weight:800;color:#fff;
}
.org-info{flex:1;min-width:0}
.org-name{font-size:.92rem;font-weight:700;color:var(--dark)}
.org-label{font-size:.72rem;color:var(--text-muted);margin-top:1px}
.org-actions{display:flex;gap:8px;margin-top:14px}
.org-btn{
  height:38px;padding:0 16px;border-radius:10px;
  font-size:.78rem;font-weight:700;display:flex;align-items:center;gap:6px;
  transition:all .2s;
}
.org-btn svg{width:16px;height:16px;flex-shrink:0}
.org-btn.wa{background:#25D366;color:#fff}
.org-btn.wa:hover{background:#1DA851}
.org-btn.report{color:var(--text-muted);border:1px solid var(--border);background:var(--white);font-size:.72rem}
.org-btn.report:hover{border-color:var(--red);color:var(--red)}

/* KOUTYE BANNER */
.koutye-banner{
  background:linear-gradient(135deg,var(--dark),var(--blue-deep));
  border-radius:var(--radius-lg);padding:18px 20px;margin-top:16px;
  color:#fff;position:relative;overflow:hidden;
}
.koutye-banner::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 200px 200px at 90% 50%, rgba(212,160,23,.15), transparent);
  pointer-events:none;
}
.koutye-banner-inner{position:relative;z-index:1}
.koutye-banner-title{
  font-size:.88rem;font-weight:800;margin-bottom:4px;
  display:flex;align-items:center;gap:6px;
}
.koutye-banner-title .icon{font-size:1rem}
.koutye-banner-desc{font-size:.78rem;color:rgba(255,255,255,.65);line-height:1.5;margin-bottom:12px}
.koutye-btn{
  height:36px;padding:0 18px;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),#C4900F);
  color:#fff;font-size:.78rem;font-weight:700;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(212,160,23,.25);transition:all .2s;
}
.koutye-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,160,23,.35)}
.koutye-btn svg{width:14px;height:14px}

/* SIMILAR EVENTS */
.similar-scroll{
  display:flex;gap:12px;overflow-x:auto;overflow-y:visible;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  padding:4px 0 8px;margin:0 -20px;padding-left:20px;padding-right:20px;
}
.similar-scroll::-webkit-scrollbar{display:none}
.sim-card{
  min-width:200px;max-width:220px;scroll-snap-align:start;flex-shrink:0;
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:all .25s;cursor:pointer;
}
.sim-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.sim-img{height:100px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.sim-date{
  position:absolute;top:8px;right:8px;
  background:var(--white);border-radius:8px;padding:4px 8px;text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.sim-date .month{font-size:.5rem;font-weight:700;text-transform:uppercase;color:var(--red);letter-spacing:.05em}
.sim-date .day{font-size:.88rem;font-weight:900;color:var(--dark);line-height:1}
.sim-body{padding:10px 12px}
.sim-title{font-size:.78rem;font-weight:700;color:var(--dark);margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sim-price{font-size:.78rem;font-weight:800;color:var(--blue)}
.sim-price.free{color:var(--green)}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);display:flex;height:56px;
}
.bottom-nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-muted);font-size:.6rem;font-weight:600;transition:color .2s;
  text-transform:uppercase;letter-spacing:.04em;
}
.bottom-nav a.active{color:var(--blue)}
.bottom-nav a svg{width:22px;height:22px}
.bottom-nav .create-tab{position:relative;margin-top:-12px}
.bottom-nav .create-dot{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(210,16,52,.3);
}
.bottom-nav .create-dot svg{color:#fff}

/* REVEAL */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-d1{transition-delay:.08s}
.reveal-d2{transition-delay:.16s}
.reveal-d3{transition-delay:.24s}

/* RESPONSIVE */
@media(min-width:768px){
  .bottom-nav{display:none}
  body{padding-bottom:0}
  .order-bar{bottom:0}
  .order-bar .inner{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;width:100%}
}
@media(min-width:500px){
  .hero-invite{aspect-ratio:2/1}
}

/* LANG BAR */
.lang-bar{background:var(--dark);padding:6px 20px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:.68rem;z-index:1001;position:relative}
.lang-bar a{color:rgba(255,255,255,.5);padding:3px 12px;border-radius:100px;font-weight:600;transition:all .2s;cursor:pointer}
.lang-bar a:hover{color:#fff;background:rgba(255,255,255,.08)}
.lang-bar a.active{color:var(--gold);background:rgba(212,160,23,.15)}
</style>
</head>
<body>

<!-- LANGUAGE BAR -->
<div class="lang-bar">
  <a class="active" data-lang="ht">Kreyòl</a>
  <a data-lang="fr">Français</a>
  <a data-lang="en">English</a>
  <a data-lang="es">Español</a>
</div>

<!-- FLAG -->
<div class="flag-stripe"></div>

<!-- HEADER -->
<header class="header">
  <a href="events.html" class="header-left">
    <img src="assets/tike-lakay-logo.png" alt="Tikè Lakay">
    <span data-i18n="brand">Tikè <em>Lakay</em></span>
  </a>
  <a href="events.html" class="header-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    <span data-i18n="back">Retounen</span>
  </a>
</header>

<!-- HERO INVITE IMAGE -->
<div class="hero-invite" id="heroInvite">
  <div class="hero-grid"></div>
  <div class="hero-content">
    <div class="hero-type-badge" id="heroType"></div>
    <h1 class="hero-title" id="heroTitle"></h1>
    <div class="hero-date-loc">
      <span id="heroDate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span id="heroDateText"></span>
      </span>
      <span id="heroLoc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="heroLocText"></span>
      </span>
    </div>
    <div class="hero-hosted" id="heroHosted"></div>
  </div>
</div>

<div class="main">

<!-- EVENT INFO CARD -->
<div class="card reveal" id="infoCard">
  <div class="card-title"><span class="icon">📋</span> <span id="infoTitle"></span></div>
  <div class="info-rows" id="infoRows"></div>

var dayNames = {

var monthNames = {
  ht: ['Jan','Fev','Mas','Avr','Mai','Jun','Jiy','Aou','Sep','Okt','Nov','Des'],
  fr: ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'],

  es: ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']
};

function formatDate(dateStr) {
  var d = new Date(dateStr + 'T00:00:00');
  var days = dayNames[currentLang] || dayNames.ht;
  var months = monthNames[currentLang] || monthNames.ht;
  return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function formatTime(t) {
  var parts = t.split(':');
  var h = parseInt(parts[0]);
  var m = parts[1];
  var ampm = h >= 12 ? 'PM' : 'AM';
  if (h > 12) h -= 12;
  if (h === 0) h = 12;
  return h + ':' + m + ' ' + ampm;
}

function formatPrice(p) {
  return p.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  /* Event Type */
  infoHtml += '<div class="info-row">' +
    '<div class="info-icon gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></div>' +
    '<div class="info-text"><div class="label">' + t('eventType') + '</div><div class="event-type-pill">' + event.typeEmoji + ' ' + event.typeLabel + '</div></div></div>';

  document.getElementById('infoRows').innerHTML = infoHtml;

  /* Description */
  document.getElementById('descText').textContent = event.description;

  /* Tickets */
  renderTickets();

  /* Organizer */
  document.getElementById('orgAvatar').textContent = event.organizer.charAt(0);
  document.getElementById('orgName').textContent = event.organizer;

  /* Koutye Banner */
  if (event.koutyeEnabled) {
    document.getElementById('koutyeBanner').style.display = 'block';
  }

  /* Similar Events */
  renderSimilar();

  /* Page title */
  document.title = event.title + ' — Tikè Lakay';
}

/* ═══ RENDER TICKETS ═══ */
function renderTickets() {
  var html = '';
  event.tickets.forEach(function(tk, i) {
    var remaining = tk.qty - tk.sold;
    var availClass = '';
    var availText = remaining + ' ' + t('spotsLeft');
    if (remaining <= 15) { availClass = ' low'; availText = remaining + ' ' + t('spotsLeft') + ' — ' + t('goingFast'); }
    if (remaining <= 0) { availClass = ' soldout'; availText = t('soldOut'); }

    var isSelected = ticketQty[i] > 0;

    html += '<div class="ticket-option' + (isSelected ? ' selected' : '') + '" id="ticket' + i + '" onclick="selectTicket(' + i + ')">';
    html += '<div class="ticket-top">';
    html += '<div class="ticket-name">' + tk.name + '</div>';
    if (tk.price === 0) {
      html += '<div class="ticket-price free">GRATIS</div>';
    } else {
      html += '<div class="ticket-price"><span class="currency">HTG</span> ' + formatPrice(tk.price) + '</div>';
    }
    html += '</div>';
    html += '<div class="ticket-desc">' + tk.desc + '</div>';
    html += '<div class="ticket-bottom">';
    html += '<div class="ticket-avail' + availClass + '"><span class="dot"></span> ' + availText + '</div>';
    if (remaining > 0) {
      html += '<div class="qty-selector" onclick="event.stopPropagation()">';
      html += '<button class="qty-btn" onclick="changeQty(' + i + ',-1)">-</button>';
      html += '<div class="qty-val" id="qtyVal' + i + '">' + ticketQty[i] + '</div>';
      html += '<button class="qty-btn" onclick="changeQty(' + i + ',1)">+</button>';
      html += '</div>';
    }
    html += '</div></div>';
  });
  document.getElementById('ticketsList').innerHTML = html;
}

/* ═══ TICKET INTERACTIONS ═══ */
function selectTicket(idx) {
  var remaining = event.tickets[idx].qty - event.tickets[idx].sold;
  if (remaining <= 0) return;
  if (ticketQty[idx] === 0) {
    ticketQty[idx] = 1;
    renderTickets();
    updateOrderBar();
  }
}

function changeQty(idx, delta) {
  var remaining = event.tickets[idx].qty - event.tickets[idx].sold;
  var newVal = ticketQty[idx] + delta;
  if (newVal < 0) newVal = 0;
  if (newVal > Math.min(remaining, 10)) newVal = Math.min(remaining, 10);
  ticketQty[idx] = newVal;
  renderTickets();
  updateOrderBar();
}

/* ═══ ORDER BAR ═══ */
function updateOrderBar() {
  var totalQty = 0;
  var totalPrice = 0;
  ticketQty.forEach(function(q, i) {
    totalQty += q;
    totalPrice += q * event.tickets[i].price;
  });

  var bar = document.getElementById('orderBar');
  if (totalQty > 0) {
    bar.classList.add('visible');
    document.getElementById('orderCount').textContent = totalQty + ' ' + t('ticketSuffix');
    document.getElementById('orderTotal').textContent = formatPrice(totalPrice);
  } else {
    bar.classList.remove('visible');
  }
}

/* ═══ DESCRIPTION TOGGLE ═══ */
var descExpanded = false;
function toggleDesc() {
  descExpanded = !descExpanded;
  var el = document.getElementById('descText');
  var btn = document.getElementById('readMoreBtn');
  var label = document.getElementById('readMoreLabel');
  if (descExpanded) {
    el.classList.remove('collapsed');
    label.textContent = t('readLess');
    btn.classList.add('expanded');
  } else {
    el.classList.add('collapsed');
    label.textContent = t('readMore');
    btn.classList.remove('expanded');
  }
}

/* ═══ SHARE ═══ */
function getShareUrl() {
  var evId = new URLSearchParams(window.location.search).get('id') || (event._id || event.id);
  return evId ? API_URL + '/api/events/' + evId + '/share' : window.location.href;
}

function shareWhatsApp() {
  var url = getShareUrl();
  var text = (event.typeEmoji || '🎤') + ' ' + event.title + '\n📅 ' + formatDate(event.date) + '\n📍 ' + event.location + '\n\nAchte tikè sou Tikè Lakay!\n' + url;
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

function shareFacebook() {
  window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(getShareUrl()), '_blank');
}

function shareEmail() {
  var subject = (event.typeEmoji || '') + ' ' + event.title + ' — Tikè Lakay';
  var body = event.title + '\n\n' +
    '📅 ' + formatDate(event.date) + ' · ' + (event.startTime || '') + (event.endTime ? ' – ' + event.endTime : '') + '\n' +
    '📍 ' + (event.location || '') + '\n\n' +
    (event.description ? event.description + '\n\n' : '') +
    'Achte tikè sou Tikè Lakay!\n' + getShareUrl();
  window.location.href = 'mailto:?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}

function copyLink() {
  navigator.clipboard.writeText(getShareUrl()).then(function() {
    var btn = document.querySelector('.share-btn.copy');
    var orig = btn.innerHTML;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:16px;height:16px"><polyline points="20 6 9 17 4 12"/></svg> <span>' + t('copied') + '</span>';
    btn.style.background = 'var(--green-light)';
    btn.style.borderColor = 'var(--green)';
    btn.style.color = 'var(--green)';
    setTimeout(function() {
      btn.innerHTML = orig;
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2000);
  });
}

/* ═══ BUY TICKETS ═══ */
function buyTickets() {
  var totalQty = 0;
  var totalPrice = 0;
  var selectedTicket = null;
  ticketQty.forEach(function(q, i) {
    if (q > 0) {
      totalQty += q;
      totalPrice += q * event.tickets[i].price;
      selectedTicket = { name: event.tickets[i].name, qty: q, price: event.tickets[i].price };
    }
  });
  if (!totalQty) return alert(t('selectTicket') || 'Chwazi omwen 1 tikè');
  if (totalPrice === 0) {
    processPayment('free', selectedTicket);
    return;
  }
  showPaymentModal(selectedTicket, totalPrice);
}

function showPaymentModal(ticket, total) {
  var fee = Math.round(total * 0.05);
  var grandTotal = total + fee;
  var modal = document.createElement('div');
  modal.id = 'paymentModal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
  modal.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:400px;width:100%;padding:24px;position:relative">' +
    '<button onclick="this.closest(\'#paymentModal\').remove()" style="position:absolute;top:12px;right:12px;font-size:1.2rem;background:none;border:none;cursor:pointer">✕</button>' +
    '<h3 style="font-family:var(--display);margin-bottom:16px">💳 ' + (t('choosePayment') || 'Chwazi Metòd Peman') + '</h3>' +
    '<div style="background:var(--off-white);border-radius:10px;padding:12px;margin-bottom:16px">' +
    '<div style="display:flex;justify-content:space-between;font-size:.9rem"><span>' + ticket.qty + 'x ' + ticket.name + '</span><span>HTG ' + formatPrice(total) + '</span></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--text-muted);margin-top:4px"><span>' + (t('platformFee') || 'Frè platfòm (5%)') + '</span><span>HTG ' + formatPrice(fee) + '</span></div>' +
    '<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">' +
    '<div style="display:flex;justify-content:space-between;font-weight:700"><span>Total</span><span>HTG ' + formatPrice(grandTotal) + '</span></div></div>' +
    '<div style="margin-bottom:12px"><input id="buyerName" placeholder="' + (t('yourName') || 'Non ou') + '" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-family:var(--body)">' +
    '<input id="buyerPhone" placeholder="' + (t('yourPhone') || 'Nimewo telefòn') + '" type="tel" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:var(--body)"></div>' +
    '<div style="display:flex;flex-direction:column;gap:8px" id="payMethodBtns">' +
    '<button onclick="processPayment(\'moncash\')" style="padding:12px;border-radius:10px;font-weight:700;font-size:.95rem;border:none;background:#E31937;color:#fff;cursor:pointer;font-family:var(--body)">📱 MonCash</button>' +
    '<button onclick="processPayment(\'natcash\')" style="padding:12px;border-radius:10px;font-weight:700;font-size:.95rem;border:none;background:#00A651;color:#fff;cursor:pointer;font-family:var(--body)">📱 NatCash</button>' +
    '<button onclick="processPayment(\'card\')" style="padding:12px;border-radius:10px;font-weight:700;font-size:.95rem;border:none;background:#1a2a4a;color:#fff;cursor:pointer;font-family:var(--body)">💳 ' + (t('creditCard') || 'Kat Kredi') + '</button>' +
    '</div><div id="payError" style="color:#D21034;font-size:.85rem;margin-top:8px;display:none"></div></div>';
  document.body.appendChild(modal);
  window._selectedTicket = ticket;
}

function processPayment(method, freeTicket) {
  var ticket = freeTicket || window._selectedTicket;
  if (!ticket) return;
  var evId = new URLSearchParams(window.location.search).get('id') || (event._id || event.id);
  var body = {
    eventId: evId, ticketName: ticket.name, qty: ticket.qty,
    paymentMethod: method,
    buyerName: document.getElementById('buyerName') ? document.getElementById('buyerName').value : '',
    buyerPhone: document.getElementById('buyerPhone') ? document.getElementById('buyerPhone').value : ''
  };
  var btns = document.getElementById('payMethodBtns');
  if (btns) btns.style.opacity = '0.5';
  fetch(API_URL + '/api/payments/buy-ticket', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.free) {
      window.location.href = 'ticket.html?ref=' + data.referenceId;
      return;
    }
    if (data.paymentUrl) {
      window.location.href = data.paymentUrl;
    } else {
      var errEl = document.getElementById('payError');
      if (errEl) { errEl.textContent = data.error || 'Erè peman'; errEl.style.display = ''; }
      if (btns) btns.style.opacity = '1';
    }
  }).catch(function(err) {
    var errEl = document.getElementById('payError');
    if (errEl) { errEl.textContent = 'Erè koneksyon'; errEl.style.display = ''; }
    if (btns) btns.style.opacity = '1';
  });
}

/* ═══ ORGANIZER ═══ */
function contactOrganizer() {
  var text = 'Bonjou! Mwen enterese nan evènman "' + event.title + '" sou Tikè Lakay.';
  window.open('https://wa.me/' + event.organizerPhone.replace('+', '') + '?text=' + encodeURIComponent(text), '_blank');
}

function reportEvent() {
  alert('Rapòte evènman sa a? Fonksyon sa a ap vini byento. Kontakte support@haitibiznis.com.');
}

/* ═══ KOUTYE ═══ */
function shareKoutye() {
  var text = '💰 Touche komisyon lè ou pataje evènman sa a!\n\n🎤 ' + event.title + '\n📅 ' + formatDate(event.date) + '\n\nAchte tikè: ' + window.location.href + '&ref=koutye';
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

/* ═══ RENDER SIMILAR EVENTS ═══ */
function renderSimilar() {
  var html = '';
  similarEvents.forEach(function(ev) {
    var priceText = ev.price === 0 ? '<span class="sim-price free">GRATIS</span>' : '<span class="sim-price">HTG ' + formatPrice(ev.price) + '</span>';
    html += '<a href="event.html" class="sim-card">' +
      '<div class="sim-img" style="background:' + ev.gradient + '">' + ev.emoji +
      '<div class="sim-date"><div class="month">' + ev.month + '</div><div class="day">' + ev.day + '</div></div></div>' +
      '<div class="sim-body"><div class="sim-title">' + ev.title + '</div>' + priceText + '</div></a>';
  });
  document.getElementById('similarEvents').innerHTML = html;
}

/* ═══ SCROLL REVEAL ═══ */
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.05, rootMargin: '0px 0px -20px 0px' });
document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });

/* ═══ INIT ═══ */
/* Set initial language from localStorage (or default ht) */
setLang(currentLang);
</script>
