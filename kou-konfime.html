<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enskripsyon Kou — HaitiBiznis</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00209F">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#00209F;--red:#D21034;--red-dark:#B00D2C;
  --gold:#D4A017;--gold-soft:#FDF3D7;
  --green:#1B8C3D;--green-light:#E8F5E9;--green-deep:#126B2C;
  --white:#FFFFFF;--off-white:#F5F7FA;
  --dark:#0A0E1A;--text:#1A2A4A;--text-light:#5A6B8A;--text-muted:#8A95AA;
  --border:#E2E8F0;--border-light:#F0F3F7;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --mono:'JetBrains Mono',monospace;
  --shadow-md:0 4px 16px rgba(10,14,26,.08);
  --radius:14px;--radius-lg:20px;
}
body{font-family:var(--body);background:var(--off-white);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
a{text-decoration:none;color:inherit}
button{font-family:var(--body);cursor:pointer;border:none;background:none}
.flag-stripe{height:4px;background:linear-gradient(90deg,var(--blue) 50%,var(--red) 50%)}
.lang-bar{background:var(--dark);display:flex;justify-content:center;gap:2px;padding:5px 8px;flex-wrap:wrap}
.lang-bar a{font-size:.7rem;font-weight:700;color:rgba(255,255,255,.62);padding:4px 10px;border-radius:6px;cursor:pointer}
.lang-bar a.active{background:var(--gold);color:var(--dark)}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between}
.header-left span{font-family:var(--display);font-size:1rem;color:var(--dark)}
.header-left span em{color:var(--red);font-style:italic}
.header-back{font-size:.78rem;font-weight:600;color:var(--text-light);
  border:1px solid var(--border);border-radius:99px;padding:7px 13px}

.wrap{max-width:520px;margin:0 auto;padding:26px 16px 60px}

/* ── PAID ───────────────────────────────────────────────────────────────── */
.ok-card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
  overflow:hidden;margin-bottom:16px}
.ok-top{background:linear-gradient(135deg,var(--green) 0%,#15A049 100%);color:#fff;
  padding:30px 20px;text-align:center}
.ok-top .tick{font-size:2.6rem;line-height:1;margin-bottom:10px}
.ok-top h1{font-family:var(--display);font-size:1.6rem;line-height:1.2;margin-bottom:6px}
.ok-top p{font-size:.92rem;opacity:.95;font-weight:600;letter-spacing:.4px}
.ok-body{padding:20px}
.ok-body h2{font-weight:800;font-size:1.1rem;color:var(--dark);line-height:1.3;margin-bottom:4px}
.ok-body .who{font-size:.85rem;color:var(--text-light);margin-bottom:14px}
.rowline{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;padding:10px 0;
  border-bottom:1px solid var(--border-light)}
.rowline span:first-child{color:var(--text-light);flex:0 0 auto}
/* min-width:0 or a flex child refuses to shrink below its content and the
   value runs off the right edge of the card - which is what "N ap prepare
   envitasyon w" did on a 420px phone. */
.rowline span:last-child{font-weight:700;color:var(--dark);text-align:right;
  flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.ref{font-family:var(--mono);font-size:.8rem;letter-spacing:.4px}

.steps{background:var(--gold-soft);border:1px solid #EBD9A0;border-radius:var(--radius);
  padding:16px;margin-top:16px}
.steps h3{font-size:.86rem;font-weight:800;color:#7A5C0A;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.steps ol{margin-left:18px;font-size:.87rem;color:#6B5208;line-height:1.65}
.steps ol li{margin-bottom:5px}
.steps .gm{font-family:var(--mono);font-weight:700;background:rgba(255,255,255,.7);
  padding:2px 6px;border-radius:5px;word-break:break-all}
.inst{font-size:.87rem;color:var(--text);line-height:1.6;white-space:pre-wrap;
  background:var(--border-light);border-radius:var(--radius);padding:14px;margin-top:14px}
.code-box{text-align:center;margin-top:14px;padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius)}
.code-box .lbl{font-size:.74rem;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px}
.code-box .val{font-family:var(--mono);font-size:1.35rem;font-weight:700;color:var(--dark);margin-top:5px;letter-spacing:1px}

.btn{display:block;width:100%;margin-top:16px;padding:16px;border-radius:12px;font-weight:800;
  font-size:1rem;text-align:center;background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(0,32,159,.25)}
.btn.g{background:var(--green);box-shadow:0 6px 18px rgba(27,140,61,.25)}
.btn2{display:block;width:100%;margin-top:9px;padding:13px;border-radius:12px;font-weight:700;
  font-size:.9rem;text-align:center;color:var(--text-light);border:1.5px solid var(--border)}

/* ── WAITING ────────────────────────────────────────────────────────────── */
.wait-card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
  padding:26px 20px;text-align:center}
.wait-card .dots{font-size:2.2rem;margin-bottom:12px}
.wait-card h1{font-family:var(--display);font-size:1.45rem;color:var(--dark);line-height:1.25;margin-bottom:8px}
.wait-card p{font-size:.9rem;color:var(--text-light);line-height:1.6}
.wait-card .tiny{font-size:.78rem;color:var(--text-muted);margin-top:14px;line-height:1.55}
.bad{background:#FDECEF;color:var(--red-dark);border:1px solid #F5C6CE;border-radius:12px;
  padding:14px;font-size:.88rem;line-height:1.5}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,32,159,.25);
  border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:220px;border-radius:var(--radius-lg);background:linear-gradient(90deg,#EEF1F6,#F7F9FC,#EEF1F6);
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="flag-stripe"></div>
<div class="lang-bar">
  <a data-lang="ht" onclick="setLang('ht')">Kreyòl</a>
  <a data-lang="fr" onclick="setLang('fr')">Français</a>
  <a data-lang="en" onclick="setLang('en')">English</a>
</div>
<div class="header">
  <div class="header-left"><span>Kou <em>Anliy</em></span></div>
  <a class="header-back" href="kou.html">&#8592; <span id="backTxt">Kou yo</span></a>
</div>

<div class="wrap">
  <div id="out"><div class="skel"></div></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   "✅ PEMAN KONFIME / KOU OU A PARE"

   Jeffery, 7 Oct 2026: "Access must NEVER be granted just because the browser
   returns from the payment page."

   This page is the browser returning from the payment page, and it has NO
   authority whatsoever. It asks the server; the server asks the gateway; the
   gateway decides. If the answer is not "completed", this page shows a waiting
   screen and keeps asking - it cannot show a Classroom link because the server
   does not send one. There is no code path here that could.

   Why it polls rather than showing one answer: on a Haitian phone the money
   and the redirect do not arrive together. MonCash finishes inside its own
   app, the browser comes back a few seconds earlier than the gateway settles,
   and a single check would tell a student who has just paid that they have
   not. So it asks every three seconds for two minutes, then hands over to the
   server's own three-minute sweep and tells the student the truth: the money
   is being checked and nothing is lost.
   ═══════════════════════════════════════════════════════════════════════════ */
var API_URL = 'https://haitibiznis-api.onrender.com';
var REF = new URLSearchParams(location.search).get('ref') || '';

var I18N = {
  ht: {
    back:'Kou yo',
    paid:'PEMAN KONFIME', ready:'KOU OU A PARE',
    by:'Pwofesè', refL:'Referans', amountL:'Montan', dateL:'Dat', emailL:'Gmail ou',
    startL:'Kòmanse', statusL:'Aksè klas la',
    stNone:'N ap prepare envitasyon w', stInvited:'Envitasyon an voye', stActive:'Ou nan klas la',
    howT:'Kijan pou w antre nan klas la',
    how1:'Louvri Gmail ou ak adrès sa a:',
    how2:'W ap jwenn yon envitasyon Google Classroom. Peze "Join" oswa "Aksepte".',
    how3:'Apre sa peze bouton ANTRE NAN KOU A anba a.',
    waitInvite:'Envitasyon an poko voye. Nou wè peman w — n ap voye envitasyon an nan Gmail ou byen vit.',
    enter:'ANTRE NAN KOU A', mine:'Kou mwen yo', codeL:'Kòd klas la',
    free:'GRATIS',
    wTitle:'N ap tcheke peman w', wBody:'Si w fin peye, tann yon ti moman — nou poze kesyon an bay konpayi peman an.',
    wTiny:'Pa fèmen paj sa a. Si w pa fin peye, ou ka tounen sou kou a epi eseye ankò.',
    sTitle:'Peman an poko konfime', sBody:'Nou pa wè lajan an ankò. Si w te peye, pa enkyete w: sèvè a ap kontinye tcheke poukont li chak 3 minit, epi lè li konfime ou ap jwenn aksè otomatikman.',
    sTiny:'Ou ka tounen sou paj sa a nenpòt lè ak menm lyen an, oswa chèche enskripsyon w ak nimewo telefòn ou.',
    retry:'Tcheke ankò', notFound:'Nou pa jwenn enskripsyon sa a. Tcheke lyen an.',
    err:'Nou pa ka tcheke kounye a. Eseye ankò nan yon ti moman.',
    noRef:'Pa gen referans nan lyen an.', noLink:'Lyen klas la poko mete. Moun ki responsab kou a ap ajoute l — n ap voye l ba ou.'
  },
  fr: {
    back:'Les cours',
    paid:'PAIEMENT CONFIRMÉ', ready:'VOTRE COURS EST PRÊT',
    by:'Professeur', refL:'Référence', amountL:'Montant', dateL:'Date', emailL:'Votre Gmail',
    startL:'Début', statusL:'Accès à la classe',
    stNone:'Invitation en préparation', stInvited:'Invitation envoyée', stActive:'Vous êtes dans la classe',
    howT:'Comment entrer dans la classe',
    how1:'Ouvrez votre Gmail avec cette adresse :',
    how2:'Vous recevrez une invitation Google Classroom. Cliquez sur « Join » ou « Accepter ».',
    how3:'Ensuite cliquez sur ENTRER DANS LE COURS ci-dessous.',
    waitInvite:'L’invitation n’est pas encore envoyée. Votre paiement est bien reçu — l’invitation arrive très vite dans votre Gmail.',
    enter:'ENTRER DANS LE COURS', mine:'Mes cours', codeL:'Code de la classe',
    free:'GRATUIT',
    wTitle:'Vérification du paiement', wBody:'Si vous avez payé, patientez un instant — nous interrogeons l’opérateur de paiement.',
    wTiny:'Ne fermez pas cette page. Si vous n’avez pas payé, retournez au cours et réessayez.',
    sTitle:'Paiement pas encore confirmé', sBody:'Nous ne voyons pas encore l’argent. Si vous avez payé, ne vous inquiétez pas : le serveur continue de vérifier tout seul toutes les 3 minutes et l’accès sera donné automatiquement.',
    sTiny:'Vous pouvez revenir sur cette page à tout moment avec le même lien, ou retrouver votre inscription avec votre numéro de téléphone.',
    retry:'Vérifier à nouveau', notFound:'Inscription introuvable. Vérifiez le lien.',
    err:'Vérification impossible pour le moment. Réessayez dans un instant.',
    noRef:'Aucune référence dans le lien.', noLink:'Le lien de la classe n’est pas encore configuré. Le responsable du cours va l’ajouter — nous vous l’enverrons.'
  },
  en: {
    back:'Courses',
    paid:'PAYMENT CONFIRMED', ready:'YOUR COURSE IS READY',
    by:'Instructor', refL:'Reference', amountL:'Amount', dateL:'Date', emailL:'Your Gmail',
    startL:'Starts', statusL:'Classroom access',
    stNone:'Invitation being prepared', stInvited:'Invitation sent', stActive:'You are in the class',
    howT:'How to get into the class',
    how1:'Open your Gmail with this address:',
    how2:'You will find a Google Classroom invitation. Tap "Join" or "Accept".',
    how3:'Then tap ENTER THE COURSE below.',
    waitInvite:'The invitation has not been sent yet. Your payment is received — the invitation will reach your Gmail very soon.',
    enter:'ENTER THE COURSE', mine:'My courses', codeL:'Class code',
    free:'FREE',
    wTitle:'Checking your payment', wBody:'If you have paid, wait a moment — we are asking the payment company.',
    wTiny:'Do not close this page. If you have not paid yet, go back to the course and try again.',
    sTitle:'Payment not confirmed yet', sBody:'We cannot see the money yet. If you did pay, do not worry: the server keeps checking on its own every 3 minutes and access is given automatically once it confirms.',
    sTiny:'You can come back to this page any time with the same link, or find your registration with your phone number.',
    retry:'Check again', notFound:'We cannot find that registration. Please check the link.',
    err:'We cannot check right now. Please try again in a moment.',
    noRef:'No reference in the link.', noLink:'The classroom link has not been set up yet. The course organiser is adding it — we will send it to you.'
  }
};
var lang = 'ht';
function t(k) { return (I18N[lang] && I18N[lang][k]) || I18N.ht[k] || k; }

function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  try { localStorage.setItem('tl_lang', l); } catch (e) {}
  document.querySelectorAll('.lang-bar a').forEach(function(a) {
    a.classList.toggle('active', a.getAttribute('data-lang') === l);
  });
  document.documentElement.lang = l;
  document.getElementById('backTxt').textContent = t('back');
  /* Redraw whatever is on screen in the new language. #out is filled by JS, so
     it is never given a data-i18n attribute - that would wipe it. */
  if (window._last) paint(window._last);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function money(n) { return Number(n || 0).toLocaleString('en-US'); }

/* An href is not a text node. A link that arrives as javascript: or data: must
   not become a button somebody taps, so only real web links are allowed
   through - anything else is shown as text instead. */
function safeUrl(u) {
  var s = String(u || '').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}

function statusWord(s) {
  if (s === 'active') return t('stActive');
  if (s === 'invited') return t('stInvited');
  return t('stNone');
}

function paint(d) {
  window._last = d;
  var out = document.getElementById('out');

  /* ── NOT PAID ───────────────────────────────────────────────────────── */
  if (!d || d.status !== 'completed') {
    var done = window._pollDone;
    out.innerHTML = '<div class="wait-card">' +
      '<div class="dots">' + (done ? '&#9203;' : '<span class="spin"></span>') + '</div>' +
      '<h1>' + (done ? t('sTitle') : t('wTitle')) + '</h1>' +
      '<p>' + (done ? t('sBody') : t('wBody')) + '</p>' +
      '<div class="tiny">' + (done ? t('sTiny') : t('wTiny')) + '</div>' +
      (done ? '<button class="btn" onclick="restart()">' + t('retry') + '</button>' : '') +
      '<a class="btn2" href="kou-mwen.html">' + t('mine') + '</a>' +
    '</div>';
    return;
  }

  /* ── PAID ───────────────────────────────────────────────────────────── */
  var c = d.course || {};
  var cr = d.classroom || {};
  var link = safeUrl(cr.link);
  var h = '<div class="ok-card">' +
    '<div class="ok-top">' +
      '<div class="tick">&#9989;</div>' +
      '<h1>' + t('paid') + '</h1>' +
      '<p>' + t('ready') + '</p>' +
    '</div>' +
    '<div class="ok-body">' +
      '<h2>' + esc(d.courseTitle || c.title || '') + '</h2>' +
      (c.instructor ? '<div class="who">' + t('by') + ': ' + esc(c.instructor) + '</div>' : '') +
      '<div class="rowline"><span>' + t('amountL') + '</span><span>' +
        (Number(d.amount) > 0 ? money(d.amount) + ' ' + esc(d.currency || 'HTG') : t('free')) + '</span></div>' +
      (c.startDate ? '<div class="rowline"><span>' + t('startL') + '</span><span>' + esc(c.startDate) + '</span></div>' : '') +
      '<div class="rowline"><span>' + t('emailL') + '</span><span>' + esc(d.email || '') + '</span></div>' +
      '<div class="rowline"><span>' + t('statusL') + '</span><span>' + statusWord(d.classroomStatus) + '</span></div>' +
      '<div class="rowline"><span>' + t('refL') + '</span><span class="ref">' + esc(d.referenceId) + '</span></div>';

  /* The instructions the organiser wrote, if any. */
  if (cr.instructions) h += '<div class="inst">' + esc(cr.instructions) + '</div>';

  h += '<div class="steps"><h3>' + t('howT') + '</h3><ol>' +
        '<li>' + t('how1') + ' <span class="gm">' + esc(d.email || '') + '</span></li>' +
        '<li>' + t('how2') + '</li>' +
        '<li>' + t('how3') + '</li>' +
      '</ol></div>';

  if (cr.code) {
    h += '<div class="code-box"><div class="lbl">' + t('codeL') + '</div>' +
         '<div class="val">' + esc(cr.code) + '</div></div>';
  }

  if (link) {
    h += '<a class="btn g" href="' + esc(link) + '" target="_blank" rel="noopener">' +
         t('enter') + ' &#8594;</a>';
  } else {
    /* Paid, but nobody has put a Classroom link on the course yet. Said
       plainly rather than showing a dead button - the student has paid and is
       entitled to know exactly what is missing. */
    h += '<div class="bad" style="margin-top:16px">' + t('noLink') + '</div>';
  }

  if (d.classroomStatus === 'none') {
    h += '<div class="inst" style="background:var(--green-light);color:var(--green-deep)">' +
         t('waitInvite') + '</div>';
  }

  h += '<a class="btn2" href="kou-mwen.html">' + t('mine') + '</a>' +
    '</div></div>';
  out.innerHTML = h;
}

/* ─── ASK THE SERVER, REPEATEDLY ─────────────────────────────────────────
   Every 3s for 2 minutes. The server reconciles on every one of these, so a
   payment that settles 20 seconds after the redirect is picked up without the
   student doing anything. After 2 minutes the polling stops - the server's own
   sweep takes over, and saying so is more honest than spinning for ever. */
var tries = 0;
var MAX_TRIES = 40;
var timer = null;

function ask() {
  if (!REF) { window._pollDone = true; paint(null); return; }
  fetch(API_URL + '/api/courses/registration/' + encodeURIComponent(REF))
    .then(function(r) { return r.json().then(function(d) { return { code: r.status, d: d }; }); })
    .then(function(res) {
      if (res.code === 404) {
        clearInterval(timer);
        document.getElementById('out').innerHTML = '<div class="bad">' + t('notFound') + '</div>';
        return;
      }
      if (res.code >= 400) return;                 /* keep trying */
      paint(res.d);
      if (res.d && res.d.status === 'completed') clearInterval(timer);
    })
    .catch(function() { /* keep trying */ })
    .then(function() {
      if (++tries >= MAX_TRIES) {
        clearInterval(timer);
        window._pollDone = true;
        if (!window._last || window._last.status !== 'completed') paint(window._last || null);
      }
    });
}

function restart() {
  tries = 0;
  window._pollDone = false;
  paint(window._last || null);
  clearInterval(timer);
  ask();
  timer = setInterval(ask, 3000);
}

(function() {
  var saved = null;
  try { saved = localStorage.getItem('tl_lang'); } catch (e) {}
  setLang(saved && I18N[saved] ? saved : 'ht');
  if (!REF) {
    document.getElementById('out').innerHTML = '<div class="bad">' + t('noRef') + '</div>';
    return;
  }
  ask();
  timer = setInterval(ask, 3000);
})();
</script>
</body>
</html>
