<!-- Served by GitHub Pages for every address that does not exist.
     Two jobs, in this order:

     1. FIX THE CAPITALS. The address bar is case-sensitive here, so
        /lajanmaker opens and /LajanMaker does not - and /LajanMaker is exactly
        how the name is written on the billboard, on the cards and in every
        message. Anyone who types what they read got a blank error page. So
        before showing anything, retry the same address in small letters.

        No redirect loop is possible: a path that is already all-lowercase
        cannot differ from its own lowercase form, so the second visit falls
        straight through to the page below. Exactly one hop, always.

     2. If that is not it, say so in a way a person can use - in their own
        language, with the way back on screen. -->
<script>
(function () {
  var p = location.pathname, low = p.toLowerCase();
  if (low !== p) { location.replace(low + location.search + location.hash); }
})();
</script>
