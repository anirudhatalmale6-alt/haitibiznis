<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LajanMaker Academy — Kou san entènèt</title>
<meta name="description" content="Telechaje leson LajanMaker Academy yo yon sèl fwa, epi etidye san entènèt.">
<meta name="theme-color" content="#0B2E6F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ═══ LAJANMAKER ACADEMY OFFLINE (8 Nov 2026) ═════════════════════════════════
   Jeffery: students in Haiti lose the signal; they must be able to download the
   lessons when they have internet and study with none.
   - Lesson files are stored in IndexedDB, NOT Cache Storage: the LajanMaker Center
     service worker (and the old homepage one) delete every cache they do not own
     when they update, which would silently wipe a student's downloads.
   - One file at a time, each retried; a cut connection only costs the file that was
     downloading. Files already on the phone are never downloaded again.
   - Playback from the stored file (blob URL): works in airplane mode.
   - Progress (lessons finished) is kept on the phone.
   - Online is needed only for the exam, the certificate and assignments.
   ═══════════════════════════════════════════════════════════════════════════════ */
:root{--navy:#0B2E6F;--red:#D21034;--green:#1B8C3D;--gold:#E0A400;--off:#F3F6FB;--white:#fff;
  --text:#152341;--light:#5A6B8A;--border:#DDE4EF;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--off);color:var(--text);line-height:1.5;padding-bottom:48px}
header{background:var(--navy);color:#fff;padding:18px 16px 16px}
.hw{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center}
header img{width:54px;height:54px;border-radius:14px;background:#fff}
header h1{font-size:1.15rem;line-height:1.2}
header p{font-size:.85rem;opacity:.85}
.lang{max-width:640px;margin:10px auto 0;display:flex;gap:6px;justify-content:flex-end}
.lang button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700}
.lang button.on{background:#fff;color:var(--navy)}
main{max-width:640px;margin:0 auto;padding:12px 14px}
.net{border-radius:12px;padding:10px 12px;font-size:.88rem;font-weight:700;margin:10px 0}
.net.on{background:#E7F6EC;color:var(--green)}.net.off{background:#FFF4E0;color:#7A4B00}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px;margin:12px 0}
.big{width:100%;border:0;border-radius:14px;padding:15px;font-size:1rem;font-weight:800;color:#fff;background:var(--red)}
.big:disabled{opacity:.6}
.big.sec{background:var(--navy)}
.bar{height:10px;background:#E6EBF3;border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
.small{font-size:.8rem;color:var(--light)}
.les{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.les:first-of-type{border-top:0}
.num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:#E8EEF8;color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center}
.num.done{background:var(--green);color:#fff}
.lt{flex:1;min-width:0}.lt b{display:block;font-size:.95rem}
.st{font-size:.76rem;font-weight:700}.st.ok{color:var(--green)}.st.no{color:var(--light)}.st.dl{color:var(--gold)}
.play{border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:var(--navy);color:#fff;font-size:.9rem}
.play:disabled{background:#B8C2D4}
h2{font-size:1rem;margin-bottom:4px}
a.lnk{display:block;text-decoration:none;color:var(--text);background:var(--white);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin:8px 0;font-weight:700}
a.lnk span{display:block;font-weight:400;font-size:.8rem;color:var(--light)}
#player{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:10px}
#player.on{display:flex}
#player video{max-width:100%;max-height:82vh;border-radius:10px;background:#000}
#player .pt{color:#fff;font-weight:700;margin:8px 0;text-align:center}
#player button{margin-top:8px;border:0;border-radius:12px;padding:12px 22px;font-weight:800;background:#fff;color:var(--navy)}
.warn{background:#FFF4E0;color:#7A4B00;border-radius:12px;padding:10px 12px;font-size:.85rem;margin-top:10px;display:none}
.rm{background:none;border:0;color:var(--light);text-decoration:underline;font-size:.8rem;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="hw"><img src="icon-192.png" alt=""><div><h1 data-t="h1">LajanMaker Academy · Kou san entènèt</h1><p data-t="sub">Telechaje yon sèl fwa, etidye kote ou vle, menm san siyal.</p></div></div>
  <div class="lang"><button data-l="ht">Kreyòl</button><button data-l="fr">Français</button></div>
</header>
<main>
  <div class="net" id="net"></div>

  <div class="card">
    <h2 data-t="dl_h">📥 Mete leson yo sou telefòn ou</h2>
    <p class="small" id="dlInfo"></p>
    <button class="big" id="dlAll" style="margin-top:10px"></button>
    <div class="bar"><i id="bar"></i></div>
    <p class="small" id="dlMsg" style="margin-top:6px"></p>
    <div class="warn" id="space"></div>
    <button class="big sec" id="install" style="display:none;margin-top:10px" data-t="install">📲 Mete Academy a sou ekran telefòn ou</button>
  </div>

  <div class="card">
    <h2 data-t="les_h">🎬 Leson yo</h2>
    <p class="small" id="prog"></p>
    <div id="list"></div>
  </div>

  <div class="card" id="docsCard" style="display:none">
    <h2 data-t="docs_h">📄 Dokiman pou etidye</h2>
    <div id="docs"></div>
  </div>

  <h2 style="margin-top:18px" data-t="more_h">Ale pi lwen</h2>
  <a class="lnk" href="../pratik/"><span data-t="prat_s">Mache SAN entènèt</span><b data-t="prat">✍️ Mòd Pratik: pratike enskripsyon yo</b></a>
  <a class="lnk" href="../"><span data-t="exam_s">Bezwen entènèt</span><b data-t="exam">🎓 Egzamen sètifikasyon + sètifika</b></a>
  <button class="rm" id="rmAll" data-t="rm">🗑️ Retire leson yo sou telefòn mwen (pou libere plas)</button>
</main>

<div id="player"><div class="pt" id="pTitle"></div><video id="vid" controls playsinline preload="metadata"></video><button id="pClose" data-t="close">Fèmen</button></div>

<script>
(function () {
  'use strict';
  var T = {
    ht: { h1: 'LajanMaker Academy · Kou san entènèt', sub: 'Telechaje yon sèl fwa, etidye kote ou vle, menm san siyal.',
      dl_h: '📥 Mete leson yo sou telefòn ou', les_h: '🎬 Leson yo', docs_h: '📄 Dokiman pou etidye', more_h: 'Ale pi lwen',
      prat: '✍️ Mòd Pratik: pratike enskripsyon yo', prat_s: 'Mache SAN entènèt', exam: '🎓 Egzamen sètifikasyon + sètifika', exam_s: 'Bezwen entènèt',
      rm: '🗑️ Retire leson yo sou telefòn mwen (pou libere plas)', close: 'Fèmen', install: '📲 Mete Academy a sou ekran telefòn ou',
      on: '🟢 Ou konekte: ou ka telechaje leson yo.', off: '🟠 Pa gen entènèt: leson ki sou telefòn ou yo mache kanmenm.',
      info: '{n} leson · {mb} MB an tout · {min} minit videyo', all: '📥 Telechaje tout leson yo ({mb} MB)', rest: '📥 Telechaje {k} leson ki rete yo ({mb} MB)',
      full: '✅ Tout leson yo sou telefòn ou', going: 'Ap telechaje {i}/{n}: {t}…', fail: '⚠️ {k} leson pa t rive (koneksyon). Peze bouton an ankò lè ou gen siyal: sa ki deja la p ap telechaje ankò.',
      done: '✅ Fini! Ou ka etidye san entènèt kounye a.', needNet: 'Pou telechaje, fòk ou gen entènèt (WiFi oswa done).',
      onPhone: '✅ Sou telefòn ou', notYet: '⬇ Poko telechaje', dling: '⏳ Ap telechaje…', watch: '▶ Gade', min: 'min',
      prog: '{d}/{n} leson fini', space: 'Telefòn ou prèske plen: {free} MB rete. Libere plas (foto, videyo WhatsApp) epi eseye ankò.',
      noNet: 'Leson sa a poko sou telefòn ou, e pa gen entènèt. Telechaje l lè ou gen siyal.', rmq: 'Retire tout leson yo sou telefòn sa a? Ou ka telechaje yo ankò pita.', open: '📖 Li', dlDoc: '⬇ Telechaje' },
    fr: { h1: 'LajanMaker Academy · Cours hors ligne', sub: 'Téléchargez une fois, étudiez partout, même sans réseau.',
      dl_h: '📥 Mettre les leçons sur votre téléphone', les_h: '🎬 Les leçons', docs_h: '📄 Documents à étudier', more_h: 'Aller plus loin',
      prat: '✍️ Mode Pratique : s’exercer aux inscriptions', prat_s: 'Fonctionne SANS internet', exam: '🎓 Examen de certification + certificat', exam_s: 'Internet nécessaire',
      rm: '🗑️ Retirer les leçons de mon téléphone (libérer de la place)', close: 'Fermer', install: '📲 Mettre l’Academy sur l’écran d’accueil',
      on: '🟢 Connecté : vous pouvez télécharger les leçons.', off: '🟠 Pas d’internet : les leçons déjà sur votre téléphone fonctionnent quand même.',
      info: '{n} leçons · {mb} Mo au total · {min} minutes de vidéo', all: '📥 Télécharger toutes les leçons ({mb} Mo)', rest: '📥 Télécharger les {k} leçons restantes ({mb} Mo)',
      full: '✅ Toutes les leçons sont sur votre téléphone', going: 'Téléchargement {i}/{n} : {t}…', fail: '⚠️ {k} leçon(s) n’ont pas pu arriver (connexion). Appuyez de nouveau quand vous avez du réseau : ce qui est déjà là ne sera pas retéléchargé.',
      done: '✅ Terminé ! Vous pouvez étudier sans internet.', needNet: 'Pour télécharger, il faut internet (WiFi ou données).',
      onPhone: '✅ Sur votre téléphone', notYet: '⬇ Pas encore téléchargée', dling: '⏳ Téléchargement…', watch: '▶ Voir', min: 'min',
      prog: '{d}/{n} leçons terminées', space: 'Votre téléphone est presque plein : {free} Mo restants. Libérez de la place et réessayez.',
      noNet: 'Cette leçon n’est pas encore sur votre téléphone et il n’y a pas d’internet.', rmq: 'Retirer toutes les leçons de ce téléphone ?', open: '📖 Lire', dlDoc: '⬇ Télécharger' }
  };
  var L = 'ht';
  try { L = localStorage.getItem('lma_off_lang') || ((navigator.language || '').slice(0, 2) === 'fr' ? 'fr' : 'ht'); } catch (e) {}
  function t(k, v) { var s = (T[L] && T[L][k]) || T.ht[k] || k; if (v) Object.keys(v).forEach(function (x) { s = s.split('{' + x + '}').join(v[x]); }); return s; }
  function $(id) { return document.getElementById(id); }
  function mb(b) { return (b / 1e6).toFixed(b < 1e7 ? 1 : 0); }

  /* ── IndexedDB: one store, key = file name, value = Blob ── */
  var DBN = 'lma-offline', ST = 'files', dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    });
    return dbp;
  }
  function idb(mode, fn) { return db().then(function (d) { return new Promise(function (res, rej) { var tx = d.transaction(ST, mode); var out = fn(tx.objectStore(ST)); tx.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); }; tx.onerror = function () { rej(tx.error); }; tx.onabort = function () { rej(tx.error); }; }); }); }
  function getBlob(k) { return idb('readonly', function (s) { return s.get(k); }); }
  function putBlob(k, b) { return idb('readwrite', function (s) { s.put(b, k); }); }
  function keys() { return idb('readonly', function (s) { return s.getAllKeys(); }); }
  function clearAll() { return idb('readwrite', function (s) { s.clear(); }); }

  var PACK = null, HAVE = {}, BUSY = false, DONE = {};
  try { DONE = JSON.parse(localStorage.getItem('lma_off_done') || '{}'); } catch (e) {}
  function saveDone() { try { localStorage.setItem('lma_off_done', JSON.stringify(DONE)); } catch (e) {} }

  function lessons() { return (PACK && PACK.lessons) || []; }
  function title(x) { return (x.title && (x.title[L] || x.title.ht)) || x.file; }
  function fileOf(x) { return (x.files && (x.files[L] || x.files.ht)) || x.file; }

  function net() { var on = navigator.onLine; var n = $('net'); n.className = 'net ' + (on ? 'on' : 'off'); n.textContent = on ? t('on') : t('off'); }

  function render() {
    document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = t(e.getAttribute('data-t')); });
    document.querySelectorAll('.lang button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-l') === L); });
    document.documentElement.lang = L;
    net();
    var ls = lessons(), tot = 0, mins = 0, missing = 0, missB = 0, d = 0;
    ls.forEach(function (x) { var f = fileOf(x); tot += x.bytes[L] || x.bytes.ht; mins += x.min || 0; if (!HAVE[f]) { missing++; missB += x.bytes[L] || x.bytes.ht; } if (DONE[x.id]) d++; });
    $('dlInfo').textContent = t('info', { n: ls.length, mb: mb(tot), min: Math.round(mins) });
    var btn = $('dlAll');
    if (!BUSY) { btn.disabled = !missing; btn.textContent = !missing ? t('full') : (missing === ls.length ? t('all', { mb: mb(tot) }) : t('rest', { k: missing, mb: mb(missB) })); }
    $('bar').style.width = ls.length ? Math.round(100 * (ls.length - missing) / ls.length) + '%' : '0';
    $('prog').textContent = t('prog', { d: d, n: ls.length });
    $('list').innerHTML = ls.map(function (x, i) {
      var f = fileOf(x), have = !!HAVE[f];
      return '<div class="les"><div class="num' + (DONE[x.id] ? ' done' : '') + '">' + (DONE[x.id] ? '✓' : (i + 1)) + '</div>' +
        '<div class="lt"><b>' + esc(title(x)) + '</b><span class="st ' + (have ? 'ok' : 'no') + '" id="st' + i + '">' + (have ? t('onPhone') : t('notYet')) + '</span> <span class="small">· ' + Math.round(x.min) + ' ' + t('min') + ' · ' + mb(x.bytes[L] || x.bytes.ht) + ' MB</span></div>' +
        '<button class="play" data-i="' + i + '">' + t('watch') + '</button></div>';
    }).join('');
    document.querySelectorAll('.play').forEach(function (b) { b.onclick = function () { play(+b.getAttribute('data-i')); }; });
    var docs = (PACK && PACK.docs) || [];
    $('docsCard').style.display = docs.length ? '' : 'none';
    $('docs').innerHTML = docs.map(function (x, i) {
      return '<div class="les"><div class="num">📄</div><div class="lt"><b>' + esc(title(x)) + '</b><span class="small">' + (x.page ? t('prat_s') : mb(x.bytes || 0) + ' MB') + '</span></div>' +
        (x.page ? '<a class="play" style="text-decoration:none" href="' + esc(x.page) + '">' + t('open') + '</a>' : '<button class="play" data-d="' + i + '">' + t('dlDoc') + '</button>') + '</div>';
    }).join('');
    document.querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { openDoc(docs[+b.getAttribute('data-d')]); }; });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function refreshHave() { return keys().then(function (k) { HAVE = {}; (k || []).forEach(function (x) { HAVE[x] = true; }); }).catch(function () { HAVE = {}; }); }

  /* one file, with progress, retried 3 times */
  function fetchFile(url, onp) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var total = +r.headers.get('content-length') || 0;
      if (!r.body || !r.body.getReader) return r.blob();
      var rd = r.body.getReader(), got = 0, parts = [];
      return (function pump() { return rd.read().then(function (o) { if (o.done) return new Blob(parts, { type: r.headers.get('content-type') || 'video/mp4' }); parts.push(o.value); got += o.value.length; if (onp && total) onp(got / total); return pump(); }); })()
        .then(function (b) { if (total && b.size !== total) throw new Error('incomplete'); return b; });
    });
  }
  function withRetry(fn, n) { return fn().catch(function (e) { if (n <= 1) throw e; return new Promise(function (r) { setTimeout(r, 2500); }).then(function () { return withRetry(fn, n - 1); }); }); }

  function downloadAll() {
    if (BUSY) return;
    if (!navigator.onLine) { $('dlMsg').textContent = t('needNet'); return; }
    BUSY = true; var btn = $('dlAll'); btn.disabled = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    var ls = lessons(), todo = ls.filter(function (x) { return !HAVE[fileOf(x)]; }), failed = 0, i = 0;
    (navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : Promise.resolve(null)).then(function (est) {
      var need = todo.reduce(function (s, x) { return s + (x.bytes[L] || x.bytes.ht); }, 0);
      if (est && est.quota && est.quota - est.usage < need * 1.3) { var w = $('space'); w.style.display = 'block'; w.textContent = t('space', { free: mb(est.quota - est.usage) }); }
      return todo.reduce(function (p, x) {
        return p.then(function () {
          i++; var f = fileOf(x), idx = ls.indexOf(x);
          btn.textContent = t('going', { i: i, n: todo.length, t: title(x) });
          var st = $('st' + idx); if (st) { st.className = 'st dl'; st.textContent = t('dling'); }
          return withRetry(function () { return fetchFile(PACK.base + f, function (fr) { $('dlMsg').textContent = Math.round(fr * 100) + '% · ' + title(x); }); }, 3)
            .then(function (b) { return putBlob(f, b); })
            .then(function () { HAVE[f] = true; if (st) { st.className = 'st ok'; st.textContent = t('onPhone'); } $('bar').style.width = Math.round(100 * Object.keys(HAVE).length / ls.length) + '%'; })
            .catch(function () { failed++; if (st) { st.className = 'st no'; st.textContent = t('notYet'); } });
        });
      }, Promise.resolve());
    }).then(function () {
      BUSY = false; $('dlMsg').textContent = failed ? t('fail', { k: failed }) : t('done'); render();
    });
  }

  var curUrl = null;
  function play(i) {
    var x = lessons()[i], f = fileOf(x), v = $('vid');
    getBlob(f).then(function (b) {
      var src = null;
      if (b) { curUrl = URL.createObjectURL(b); src = curUrl; }
      else if (navigator.onLine) src = PACK.base + f;
      else { alert(t('noNet')); return; }
      $('pTitle').textContent = title(x); v.src = src; $('player').classList.add('on'); v.play().catch(function () {});
      v.ontimeupdate = function () { if (v.duration && v.currentTime / v.duration > 0.9 && !DONE[x.id]) { DONE[x.id] = Date.now(); saveDone(); } };
    });
  }
  function closePlayer() { var v = $('vid'); v.pause(); v.removeAttribute('src'); v.load(); if (curUrl) { URL.revokeObjectURL(curUrl); curUrl = null; } $('player').classList.remove('on'); render(); }

  function openDoc(x) {
    var f = (x.files && (x.files[L] || x.files.ht)) || x.file;
    getBlob(f).then(function (b) {
      if (b) { var u = URL.createObjectURL(b); var a = document.createElement('a'); a.href = u; a.download = f; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 60000); }
      else if (navigator.onLine) { window.open(PACK.base + f, '_blank'); }
      else alert(t('noNet'));
    });
  }

  /* the pack: from the network when online (kept for offline), else the saved copy */
  function loadPack() {
    var saved = null; try { saved = JSON.parse(localStorage.getItem('lma_off_pack') || 'null'); } catch (e) {}
    return fetch('pack.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (p) { try { localStorage.setItem('lma_off_pack', JSON.stringify(p)); } catch (e) {} return p; })
      .catch(function () { return saved; });
  }

  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; $('install').style.display = ''; });
  $('install').onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { $('install').style.display = 'none'; deferred = null; }); };

  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { L = b.getAttribute('data-l'); try { localStorage.setItem('lma_off_lang', L); } catch (e) {} refreshHave().then(render); }; });
  $('dlAll').onclick = downloadAll;
  $('pClose').onclick = closePlayer;
  $('rmAll').onclick = function () { if (!confirm(t('rmq'))) return; clearAll().then(refreshHave).then(render); };
  window.addEventListener('online', render); window.addEventListener('offline', render);

  loadPack().then(function (p) { PACK = p || { lessons: [], docs: [], base: 'v/' }; return refreshHave(); }).then(render);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(function () {});
})();
</script>
</body>
</html>
