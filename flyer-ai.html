<!DOCTYPE html>
<html lang="ht"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tikè Lakay → tikelakay.com</title><meta name="robots" content="noindex">
<link rel="canonical" href="https://tikelakay.com/flyer-ai.html">
<script>
/* 30 Oct 2026: Tikè Lakay moved to tikelakay.com (Jeffery's "Go live").
   This old address forwards there, keeping ?ref= / ?id= / ?t= and anything
   after "#". An organiser's own events and their codes live in THIS site's
   storage, so a short copy of them travels in the "#" part (never sent to
   any server); the new site takes it in once and wipes it from the address. */
(function(){
  var base='https://tikelakay.com/flyer-ai.html', mig={};
  try{
    var man=JSON.parse(localStorage.getItem('tl_manage')||'{}');
    var evs=JSON.parse(localStorage.getItem('tl_events')||'[]').filter(function(e){return e&&e._id&&man[e._id];})
      .map(function(e){return {_id:e._id,title:e.title||'',date:e.date||'',location:e.location||'',startTime:e.startTime||'',type:e.type||''};});
    if(Object.keys(man).length){mig.tl_manage=man;mig.tl_events=evs;}
    ['tl_lang','tl_door_code','tl_door_id'].forEach(function(k){var v=localStorage.getItem(k);if(v)mig[k]=v;});
  }catch(e){}
  var hash=(location.hash||'').replace(/^#/,'');
  if(Object.keys(mig).length){
    var enc='';
    try{enc=btoa(unescape(encodeURIComponent(JSON.stringify(mig)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){}
    if(enc)hash=(hash?hash+'&':'')+'tlmig='+enc;
  }
  location.replace(base+location.search+(hash?'#'+hash:''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://tikelakay.com/flyer-ai.html"></noscript>

</head><body><p>🎟️ Tikè Lakay deplase sou <a href="https://tikelakay.com/flyer-ai.html">tikelakay.com</a>…</p></body></html>
