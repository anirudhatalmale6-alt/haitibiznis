<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LajanMaker Center</title>

<!-- This page exists so the printed / filmed QR code never has to change.
     The code encodes haitibiznis.com/lajanmaker and nothing else; where that
     lands is decided HERE. If LajanMaker Center ever moves - to its own
     domain, to a store listing - change the two lines marked GOES-TO below
     and every flyer, card and video already in the wild keeps working. -->

<!-- GOES-TO (1 of 2) -->
<meta http-equiv="refresh" content="0; url=/pos/">
<link rel="canonical" href="https://haitibiznis.com/pos/">
<meta name="robots" content="noindex,follow">

<link rel="icon" href="../assets/favicon-32.png" sizes="32x32">
<meta name="theme-color" content="#00209F">
<meta property="og:title" content="LajanMaker Center - APRANN • VANN • FÈ LAJAN">
<meta property="og:description" content="Enskri, vann sèvis, touche komisyon. 7 jou GRATIS.">
<meta property="og:image" content="https://haitibiznis.com/pos/assets/og-lajanmaker.png">
<meta property="og:url" content="https://haitibiznis.com/lajanmaker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;text-align:center;background:linear-gradient(160deg,#00209F,#001566);
       font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
  .card{width:100%;max-width:360px}
  img.mark{width:132px;height:132px;border-radius:26px;background:#fff;padding:8px;
           box-shadow:0 14px 34px rgba(0,0,0,.34)}
  h1{font-size:22px;margin:20px 0 6px;letter-spacing:.2px}
  .slog{font-size:12px;letter-spacing:1.6px;color:#9fc0ff;margin:0 0 26px}
  .spin{width:30px;height:30px;margin:0 auto 16px;border-radius:50%;
        border:3px solid rgba(255,255,255,.28);border-top-color:#fff;
        animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .wait{font-size:13px;color:#c9d8ff;margin:0 0 22px}
  a.go{display:block;padding:15px 18px;border-radius:14px;text-decoration:none;
       font-weight:700;font-size:15.5px;color:#fff;
       background:linear-gradient(90deg,#E31B23,#ff3d45);
       box-shadow:0 10px 24px rgba(227,27,35,.4)}
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="../assets/lajanmaker-logo.png" alt="LajanMaker Center">
    <h1>LajanMaker Center</h1>
    <p class="slog">APRANN • VANN • FÈ LAJAN</p>
    <div class="spin"></div>
    <p class="wait">Ap ouvri&hellip; / Opening&hellip;</p>
    <!-- GOES-TO (2 of 2) -->
    <a class="go" href="/pos/">Louvri LajanMaker Center &rarr;</a>
  </div>
<script>location.replace('/pos/');</script>
</body>
</html>
