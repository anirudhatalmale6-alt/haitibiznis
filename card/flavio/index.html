<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--navy:#0b2a6b;--blue:#0a34c4;--green:#009B3A;--gold:#FFCC29;--wa:#25D366;--ink:#0f1830;--muted:#a8bce0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:radial-gradient(1100px 560px at 50% -8%,#0d3a86 0%,#0b2a6b 44%,#041027 100%);
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 16px 34px}
.wrap{width:100%;max-width:470px;text-align:center}
.langbar{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.langbar button{appearance:none;border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);color:#dfe7ff;
  font-weight:800;font-size:12px;letter-spacing:.05em;padding:7px 13px;border-radius:20px;cursor:pointer;transition:.15s}
.langbar button.on{background:linear-gradient(135deg,var(--green),#00762c);color:#fff;border-color:transparent}
.brandline{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#cdd8f5;margin-bottom:14px;text-transform:uppercase}
.cardimg{display:block;width:100%;border-radius:18px;box-shadow:0 24px 60px rgba(0,6,40,.6);border:3px solid rgba(255,255,255,.9)}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px;font-weight:600}
.acts{margin-top:20px;display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:15px;padding:16px 17px;
  font-size:16px;font-weight:800;text-decoration:none;color:#fff;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.b-save{background:linear-gradient(135deg,var(--gold),#e0a91a);color:#3a2a00}
.b-share{background:linear-gradient(135deg,var(--wa),#128C7E)}
.b-img{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(4px)}
.b-pos{background:linear-gradient(135deg,var(--green),#00762c);border:1.5px solid rgba(255,255,255,.25)}
.foot{margin-top:20px;font-size:12.5px;color:#cdd8f5;font-weight:700}
.foot a{color:#fff;text-decoration:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#0b1636;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar" id="langbar"><button data-lang="pt">PT</button><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="fr">FR</button><button data-lang="ht">HT</button></div>
  <div class="brandline" data-i18n="brand">48 Horas Pronto · Cartão de Visita Digital</div>
  <a href="../assets/card-flavio.jpg" target="_blank" rel="noopener" aria-label="Abrir o cartão">
    <img class="cardimg" src="../assets/card-flavio.jpg" alt="Flavio Michelli — Country Director Brazil, 48 Horas Pronto">
  </a>
  <div class="hint" data-i18n="hint">Toque no cartão para ampliar</div>
  <div class="acts">
    <a class="btn b-save" href="flavio.vcf" id="saveBtn" data-i18n="save">💾 Salvar o meu contato</a>
    <button class="btn b-share" id="shareBtn" data-i18n="share">📲 Compartilhar o meu cartão</button>
    <a class="btn b-img" href="../assets/card-flavio.jpg" download="48HorasPronto-Flavio-Michelli.jpg" data-i18n="img">⬇️ Salvar a imagem do cartão</a>
    <a class="btn b-pos" href="../../pos/?lang=pt" data-i18n="pos">🛍️ Abrir o POS 48 Horas Pronto</a>
  </div>
  <div class="foot"><a href="https://haitibiznis.com" target="_blank" rel="noopener">www.HaitiBiznis.com</a></div>
</div>
<div class="toast" id="toast"></div>
<script>
var T={
 pt:{brand:"48 Horas Pronto · Cartão de Visita Digital",hint:"Toque no cartão para ampliar",
     save:"💾 Salvar o meu contato",share:"📲 Compartilhar o meu cartão",img:"⬇️ Salvar a imagem do cartão",
     pos:"🛍️ Abrir o POS 48 Horas Pronto",t_saved:"Contato salvo nos downloads",t_copied:"Link do cartão copiado!",
     sh_at:"na",sh_here:"Este é o meu cartão:"},
 en:{brand:"48 Horas Pronto · Digital Business Card",hint:"Tap the card to enlarge",
     save:"💾 Save My Contact",share:"📲 Share My Card",img:"⬇️ Save Card Image",
     pos:"🛍️ Open the 48 Horas Pronto POS",t_saved:"Contact saved to downloads",t_copied:"Card link copied!",
     sh_at:"at",sh_here:"Here is my card:"},
 es:{brand:"48 Horas Pronto · Tarjeta de Presentación Digital",hint:"Toca la tarjeta para ampliar",
     save:"💾 Guardar mi contacto",share:"📲 Compartir mi tarjeta",img:"⬇️ Guardar imagen de la tarjeta",
     pos:"🛍️ Abrir el POS 48 Horas Pronto",t_saved:"Contacto guardado en descargas",t_copied:"¡Enlace de la tarjeta copiado!",
     sh_at:"en",sh_here:"Esta es mi tarjeta:"},
 fr:{brand:"48 Horas Pronto · Carte de Visite Numérique",hint:"Touchez la carte pour l’agrandir",
     save:"💾 Enregistrer mon contact",share:"📲 Partager ma carte",img:"⬇️ Enregistrer l’image",
     pos:"🛍️ Ouvrir le POS 48 Horas Pronto",t_saved:"Contact enregistré dans les téléchargements",t_copied:"Lien de la carte copié !",
     sh_at:"chez",sh_here:"Voici ma carte :"},
 ht:{brand:"48 Horas Pronto · Kat Biznis Dijital",hint:"Tape kat la pou agrandi",
     save:"💾 Sove Kontak Mwen",share:"📲 Pataje Kat Mwen",img:"⬇️ Sove Imaj Kat la",
     pos:"🛍️ Ouvri POS 48 Horas Pronto",t_saved:"Kontak sove nan telechajman",t_copied:"Lyen kat la kopye!",
     sh_at:"nan",sh_here:"Men kat mwen:"}
};
var LANGS=['pt','en','es','fr','ht'];
var SLUG="flavio",FN="Flavio Michelli",TITLE="Country Director – Brazil",
VCARD="BEGIN:VCARD\r\nVERSION:3.0\r\nN:Michelli;Flavio;;;\r\nFN:Flavio Michelli\r\nORG:HB Technologies\r\nTITLE:Country Director - Brazil\r\nTEL;TYPE=CELL,VOICE:+5548988096064\r\nEMAIL;TYPE=INTERNET:info@48hoursready.com\r\nURL:https://haitibiznis.com\r\nADR;TYPE=WORK:;;;;;;Brasil\r\nNOTE:48 Horas Pronto - Solucoes digitais para o seu negocio. Atendemos todo o Brasil.\r\nEND:VCARD\r\n",
CARDURL="https://haitibiznis.com/card/flavio/";
var lang='pt';
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}
function tr(k){return (T[lang]&&T[lang][k]!=null)?T[lang][k]:T['pt'][k];}
function applyLang(l){
  if(LANGS.indexOf(l)<0)l='pt';lang=l;document.documentElement.lang=(l==='pt'?'pt-BR':l);
  var ns=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<ns.length;i++){var k=ns[i].getAttribute('data-i18n');var v=tr(k);if(v!=null)ns[i].textContent=v;}
  var bs=document.querySelectorAll('#langbar button');
  for(var j=0;j<bs.length;j++){bs[j].classList.toggle('on',bs[j].getAttribute('data-lang')===l);}
  /* The POS opens in whatever language the visitor is reading the card in. */
  var pb=document.querySelector('.b-pos');if(pb)pb.setAttribute('href','../../pos/?lang='+l);
}
(function(){var bs=document.querySelectorAll('#langbar button');
  for(var i=0;i<bs.length;i++){(function(b){b.addEventListener('click',function(){applyLang(b.getAttribute('data-lang'));});})(bs[i]);}
  /* This is the Brazilian card — it opens in Portuguese, whatever is in localStorage. */
  applyLang('pt');})();
document.getElementById('saveBtn').addEventListener('click',function(e){
  try{var isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    if(!isiOS){e.preventDefault();
      var blob=new Blob([VCARD],{type:'text/vcard'});var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;a.download=SLUG+'.vcf';document.body.appendChild(a);a.click();a.remove();
      toast(tr('t_saved'));setTimeout(function(){URL.revokeObjectURL(url);},4000);}
  }catch(err){}
});
document.getElementById('shareBtn').addEventListener('click',function(){
  var txt=FN+', '+TITLE+' '+tr('sh_at')+' 48 Horas Pronto. '+tr('sh_here');
  var data={title:FN+' — 48 Horas Pronto',text:txt,url:CARDURL};
  if(navigator.share){navigator.share(data).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(CARDURL).then(function(){toast(tr('t_copied'));});}
  else{window.open('https://wa.me/?text='+encodeURIComponent(txt+' '+CARDURL),'_blank');}
});
</script>
</body>
</html>
