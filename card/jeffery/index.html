<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jeffery Boyard — HaitiBiznis Business Card</title>
<meta name="description" content="Jeffery Boyard, Co-Founder & CEO — HaitiBiznis. Save my contact or share my card.">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<meta property="og:type" content="profile">
<meta property="og:title" content="Jeffery Boyard — Co-Founder & CEO · HaitiBiznis">
<meta property="og:description" content="Save my contact or share my business card.">
<meta property="og:url" content="https://haitibiznis.com/card/jeffery/">
<meta property="og:image" content="https://haitibiznis.com/card/assets/card-jeffery.jpg">
<meta property="og:image:width" content="1636"><meta property="og:image:height" content="961">
<meta name="twitter:card" content="summary_large_image">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--navy:#00209F;--blue:#0a34c4;--red:#D21034;--gold:#F2C230;--wa:#25D366;--ink:#0f1830;--muted:#9fb0d6}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:radial-gradient(1100px 560px at 50% -8%,#0a34c4 0%,#00209F 44%,#000f3c 100%);
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 34px}
.wrap{width:100%;max-width:470px;text-align:center}
.brandline{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#cdd8f5;margin-bottom:14px;text-transform:uppercase}
.cardimg{display:block;width:100%;border-radius:18px;box-shadow:0 24px 60px rgba(0,6,40,.6);border:3px solid rgba(255,255,255,.9)}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px;font-weight:600}
.acts{margin-top:20px;display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:15px;padding:16px 17px;
  font-size:16px;font-weight:800;text-decoration:none;color:#fff;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.b-save{background:linear-gradient(135deg,var(--gold),#e0a91a);color:#3a2a00}
.b-share{background:linear-gradient(135deg,var(--wa),#128C7E)}
.b-img{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(4px)}
.b-more{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#dfe7ff;font-weight:700;font-size:14px;padding:12px}
.foot{margin-top:20px;font-size:12.5px;color:#cdd8f5;font-weight:700}
.foot a{color:#fff;text-decoration:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#0b1636;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandline">HaitiBiznis · Digital Business Card</div>
  <a href="../assets/card-jeffery.jpg" target="_blank" rel="noopener" aria-label="Open full card">
    <img class="cardimg" src="../assets/card-jeffery.jpg" alt="Jeffery Boyard — Co-Founder & CEO, HaitiBiznis business card">
  </a>
  <div class="hint">Tap the card to enlarge · scan the QR to connect</div>
  <div class="acts">
    <a class="btn b-save" href="jeffery.vcf" id="saveBtn">💾 Save My Contact</a>
    <button class="btn b-share" id="shareBtn">📲 Share My Card</button>
    <a class="btn b-img" href="../assets/card-jeffery.jpg" download="HaitiBiznis-jeffery.jpg">⬇️ Save Card Image</a>
    <a class="btn b-more" href="../">See the whole team →</a>
  </div>
  <div class="foot"><a href="https://haitibiznis.com" target="_blank" rel="noopener">www.HaitiBiznis.com</a></div>
</div>
<div class="toast" id="toast"></div>
<script>
var VCARD='BEGIN:VCARD\r\nVERSION:3.0\r\nN:Boyard;Jeffery;;;\r\nFN:Jeffery Boyard\r\nORG:HaitiBiznis\r\nTITLE:Co-Founder & CEO\r\nTEL;TYPE=CELL,VOICE:+13476366742\r\nEMAIL;TYPE=INTERNET:Jeffery@HaitiBiznis.com\r\nURL:https://haitibiznis.com\r\nADR;TYPE=WORK:;;#123 Ave Martin Luther King;;;;Haiti\r\nNOTE:HaitiBiznis - Building Haiti\'s Digital Bridge to the World. WhatsApp +1 (347) 636-6742\r\nEND:VCARD\r\n';
var CARDURL='https://haitibiznis.com/card/jeffery/';
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on');},2200);}
document.getElementById('saveBtn').addEventListener('click',function(e){
  try{
    var isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);
    if(!isiOS){
      e.preventDefault();
      var blob=new Blob([VCARD],{type:'text/vcard'});var url=URL.createObjectURL(blob);
      var a=document.createElement('a');a.href=url;a.download='jeffery.vcf';document.body.appendChild(a);a.click();a.remove();
      toast('Contact saved to downloads');setTimeout(function(){URL.revokeObjectURL(url);},4000);
    }
  }catch(err){}
});
document.getElementById('shareBtn').addEventListener('click',function(){
  var data={title:'Jeffery Boyard — HaitiBiznis',text:'Jeffery Boyard, Co-Founder & CEO at HaitiBiznis. Here is my card:',url:CARDURL};
  if(navigator.share){navigator.share(data).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(CARDURL).then(function(){toast('Card link copied!');});}
  else{window.open('https://wa.me/?text='+encodeURIComponent(data.text+' '+CARDURL),'_blank');}
});
</script>
</body>
</html>
