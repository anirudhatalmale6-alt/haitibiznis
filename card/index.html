<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HaitiBiznis — Business Cards</title>
<meta name="description" content="HaitiBiznis team digital business cards — tap a card to save the contact or share.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<meta property="og:title" content="HaitiBiznis — Business Cards">
<meta property="og:description" content="Tap a card to save the contact or share.">
<meta property="og:url" content="https://haitibiznis.com/card/">
<meta property="og:image" content="https://haitibiznis.com/card/assets/card-jeffery.jpg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{--navy:#00209F;--blue:#0a34c4;--red:#D21034;--gold:#F2C230;--wa:#25D366;--ink:#0f1830;--muted:#9fb0d6}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;
  background:radial-gradient(1100px 560px at 50% -8%,#0a34c4 0%,#00209F 44%,#000f3c 100%);
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 34px}
.wrap{width:100%;max-width:470px;text-align:center}
.brandline{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#cdd8f5;margin-bottom:14px;text-transform:uppercase}
.cardimg{display:block;width:100%;border-radius:18px;box-shadow:0 24px 60px rgba(0,6,40,.6);border:3px solid rgba(255,255,255,.9)}
.hint{font-size:11.5px;color:var(--muted);margin-top:9px;font-weight:600}
.acts{margin-top:20px;display:flex;flex-direction:column;gap:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:15px;padding:16px 17px;
  font-size:16px;font-weight:800;text-decoration:none;color:#fff;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.b-save{background:linear-gradient(135deg,var(--gold),#e0a91a);color:#3a2a00}
.b-share{background:linear-gradient(135deg,var(--wa),#128C7E)}
.b-img{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(4px)}
.b-pos{background:linear-gradient(135deg,var(--blue),var(--navy));border:1.5px solid rgba(255,255,255,.25)}
.b-more{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#dfe7ff;font-weight:700;font-size:14px;padding:12px}
.foot{margin-top:20px;font-size:12.5px;color:#cdd8f5;font-weight:700}
.foot a{color:#fff;text-decoration:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#0b1636;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.tcard{display:block;text-decoration:none;color:#fff;margin-bottom:20px}
.tname{display:block;margin-top:9px;font-size:16px;font-weight:800;color:#fff}
.tname small{display:block;font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.hd{font-size:24px;font-weight:900;margin-bottom:4px}
.hs{font-size:13px;color:#cdd8f5;font-weight:600;margin-bottom:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandline">HaitiBiznis</div>
  <div class="hd">Our Business Cards</div>
  <div class="hs">Tap a card to save the contact or share it</div>
  <a class="tcard" href="jeffery/"><img class="cardimg" src="assets/card-jeffery.jpg" alt="Jeffery Boyard — Co-Founder & CEO"><span class="tname">Jeffery Boyard <small>Co-Founder & CEO</small></span></a>
<a class="tcard" href="gilbert/"><img class="cardimg" src="assets/card-gilbert.jpg" alt="Gilbert Hippolyte — Chief Connector Officer"><span class="tname">Gilbert Hippolyte <small>Chief Connector Officer</small></span></a>
<a class="tcard" href="emile/"><img class="cardimg" src="assets/card-emile.jpg" alt="Dukens Emile — Directeur Commercial"><span class="tname">Dukens Emile <small>Directeur Commercial</small></span></a>
<a class="tcard" href="joe/"><img class="cardimg" src="assets/card-joe.jpg" alt="Joe Lambert — Directeur de la Securite Strategique"><span class="tname">Joe Lambert <small>Directeur de la Securite Strategique</small></span></a>

  <div class="foot"><a href="https://haitibiznis.com" target="_blank" rel="noopener">www.HaitiBiznis.com</a></div>
</div>
</body>
</html>
