<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Video Eksplikatif — Egzanp | HaitiBiznis Technologies</title>
<meta property="og:title" content="Video Eksplikatif — Egzanp (HaitiBiznis Technologies)">
<meta property="og:description" content="Yon egzanp video eksplikatif pwofesyonèl nou fè pou biznis ou. Powered by HaitiBiznis.com">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://haitibiznis.com/samples/video-explainer/">

<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#00209F; --blue2:#0a44e0; --navy:#001741; --red:#D21034; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Montserrat',system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, #16346f 0%, var(--blue) 45%, var(--navy) 100%);
    color:#fff; min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:14px 10px 26px; overflow-x:hidden;}
  header{text-align:center; margin-bottom:14px;}
  header .kick{font-weight:800; font-size:10px; letter-spacing:.24em; color:#9fb6ff; text-transform:uppercase;}
  header h1{font-weight:900; font-size:clamp(16px,4.6vw,24px); margin-top:5px; line-height:1.15;}
  header h1 span{color:#fff; background:var(--red); padding:1px 9px; border-radius:8px;}
  header .sub{font-size:11.5px; color:#c9d4ea; margin-top:7px; font-weight:600;}
  .badge{display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.3); border-radius:20px; padding:5px 14px; font-size:11px;
    font-weight:800; letter-spacing:.05em; margin-top:10px; color:#dfe7f6;}
  .stage{width:100%; max-width:820px;}
  .frame{position:relative; width:100%; padding-top:56.25%; border-radius:12px; overflow:hidden;
    box-shadow:0 22px 55px rgba(0,0,0,.55); background:#000;}
  .frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .dl{margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .dl a{color:#fff; background:linear-gradient(135deg,var(--blue2),var(--blue));
    text-decoration:none; font-weight:800; font-size:12.5px; letter-spacing:.04em;
    padding:11px 22px; border-radius:30px; display:inline-flex; align-items:center; gap:8px;
    box-shadow:0 8px 20px rgba(0,0,0,.32);}
  .dl a#share{background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.5);}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--blue); border:1.5px solid rgba(255,255,255,.5); color:#fff; font-size:12.5px; font-weight:700;
    padding:11px 22px; border-radius:24px; opacity:0; pointer-events:none; transition:.3s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  footer{margin-top:22px; font-size:11px; color:#8fa2c8; text-align:center;}
  footer b{color:#fff;}
</style>
</head>
<body>
  <header>
    <div class="kick">HaitiBiznis Technologies</div>
    <h1>Video Eksplikatif — <span>Egzanp</span></h1>
    <div class="sub">Sa a se yon egzanp video eksplikatif pwofesyonèl nou fè pou biznis ou.</div>
    <div class="badge">🎬 Gade video a</div>
  </header>

  <div class="stage">
    <div class="frame">
      <iframe src="https://www.youtube.com/embed/8rxAOdyn2OM?rel=0&modestbranding=1&playsinline=1"
        title="HaitiBiznis — Video Eksplikatif (Egzanp)"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
  </div>

  <div class="dl">
    <a href="https://youtu.be/8rxAOdyn2OM" target="_blank" rel="noopener">▶ Louvri sou YouTube</a>
    <a href="#" id="share" role="button">⤴ Pataje</a>
  </div>
  <div class="toast" id="toast">Lyen kopye</div>
  <footer>Powered by <b>HaitiBiznis.com</b> · Konekte · Fè Lajan · Devlope</footer>

  <script>
    var toast = document.getElementById('toast');
    function showToast(msg){ toast.textContent = msg; toast.classList.add('show');
      setTimeout(function(){ toast.classList.remove('show'); }, 2200); }
    document.getElementById('share').onclick = function(e){
      e.preventDefault();
      var data = {
        title: 'HaitiBiznis Technologies — Video Eksplikatif (Egzanp)',
        text: 'Yon egzanp video eksplikatif pwofesyonèl HaitiBiznis fè pou biznis ou.',
        url: location.href
      };
      if (navigator.share){ navigator.share(data).catch(function(){}); }
      else if (navigator.clipboard){ navigator.clipboard.writeText(location.href)
        .then(function(){ showToast('Lyen kopye'); })
        .catch(function(){ showToast(location.href); }); }
      else { window.prompt('Kopye lyen an pou pataje:', location.href); }
    };
  </script>
</body>
</html>
