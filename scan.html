<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#00209F;--blue-dark:#001566;--blue-light:rgba(0,32,159,.06);
  --red:#D21034;--red-light:rgba(210,16,52,.08);
  --gold:#D4A017;--gold-bg:rgba(212,160,23,.08);
  --white:#FFFFFF;--off-white:#FFF8F8;--cream:#F8F6F3;
  --dark:#1A0C0C;--text:#2A1A1A;--text-light:#6A5A5A;--text-muted:#9A8A8A;
  --green:#25D366;--green-light:rgba(37,211,102,.08);
  --border:#E8E0E0;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  --display:'DM Serif Display',Georgia,serif;
  --radius:16px;--radius-sm:12px;
}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);background:var(--dark);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
button{font-family:var(--body);cursor:pointer;border:none;background:none}
input{font-family:var(--body);border:none;outline:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulseGreen{0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,.4)}50%{box-shadow:0 0 0 20px rgba(37,211,102,0)}}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(210,16,52,.4)}50%{box-shadow:0 0 0 20px rgba(210,16,52,0)}}
@keyframes scanLine{0%{top:10%}100%{top:85%}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}

/* HEADER */
.header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.h-left{display:flex;align-items:center;gap:8px}
.h-logo{font-family:var(--display);font-size:1.05rem;color:var(--white)}
.h-logo span{color:var(--red)}
.h-badge{font-size:.5rem;font-weight:900;color:var(--gold);background:rgba(212,160,23,.15);padding:3px 8px;border-radius:100px;letter-spacing:.08em;text-transform:uppercase}
.h-right{display:flex;align-items:center;gap:8px}
.h-lang{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:6px;padding:2px}
.h-lang a{color:rgba(255,255,255,.3);font-size:.55rem;font-weight:800;padding:4px 6px;border-radius:4px;cursor:pointer}
.h-lang a.active{color:var(--dark);background:var(--white)}
.h-back{font-size:.7rem;font-weight:700;color:rgba(255,255,255,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);transition:all .2s}
.h-back:hover{color:var(--white);border-color:rgba(255,255,255,.3)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 20px}

/* SCANNER VIEW */
.scanner-area{width:100%;max-width:340px;aspect-ratio:1;border-radius:24px;position:relative;overflow:hidden;background:#111;border:3px solid rgba(255,255,255,.1);margin-bottom:24px}
.scanner-corners{position:absolute;inset:0;pointer-events:none}
.scanner-corners::before,.scanner-corners::after{content:'';position:absolute;width:40px;height:40px;border-color:var(--gold);border-style:solid;border-width:0}
.scanner-corners::before{top:16px;left:16px;border-top-width:3px;border-left-width:3px;border-radius:4px 0 0 0}
.scanner-corners::after{top:16px;right:16px;border-top-width:3px;border-right-width:3px;border-radius:0 4px 0 0}
.scanner-corners2{position:absolute;inset:0;pointer-events:none}
.scanner-corners2::before,.scanner-corners2::after{content:'';position:absolute;width:40px;height:40px;border-color:var(--gold);border-style:solid;border-width:0}
.scanner-corners2::before{bottom:16px;left:16px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 4px}
.scanner-corners2::after{bottom:16px;right:16px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 4px 0}
.scan-line{position:absolute;left:16px;right:16px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scanLine 2s ease-in-out infinite alternate;pointer-events:none}
.camera-feed{width:100%;height:100%;object-fit:cover;display:none}
.camera-feed.active{display:block}
.camera-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:rgba(255,255,255,.3)}
.camera-placeholder .cp-icon{font-size:3rem}
.camera-placeholder .cp-text{font-size:.78rem;font-weight:700;text-align:center;line-height:1.5}
.camera-placeholder.hide{display:none}
.camera-btn{padding:14px 28px;border-radius:14px;font-size:.85rem;font-weight:800;color:var(--dark);background:var(--gold);box-shadow:0 4px 20px rgba(212,160,23,.3);transition:all .2s}
.camera-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(212,160,23,.4)}

/* MODE TABS */
.mode-tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px}
.mode-tab{flex:1;padding:12px 8px;border-radius:10px;font-size:.68rem;font-weight:800;color:rgba(255,255,255,.4);text-align:center;cursor:pointer;transition:all .2s;letter-spacing:.02em}
.mode-tab.active{color:var(--white);background:rgba(255,255,255,.12)}
.mode-tab .mt-icon{display:block;font-size:1.2rem;margin-bottom:4px}

/* MANUAL ENTRY */
.manual-section{width:100%;max-width:340px;margin-bottom:24px}
.manual-title{font-size:.72rem;font-weight:800;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;text-align:center}
.manual-row{display:flex;gap:8px}
.manual-input{flex:1;padding:16px 18px;border-radius:14px;font-size:1rem;font-weight:700;color:var(--white);background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.1);text-align:center;letter-spacing:.15em;text-transform:uppercase;transition:border-color .2s}
.manual-input:focus{border-color:var(--gold);background:rgba(255,255,255,.12)}
.manual-input::placeholder{color:rgba(255,255,255,.2);letter-spacing:.1em;text-transform:none;font-weight:500}
.manual-btn{padding:16px 24px;border-radius:14px;font-size:.9rem;font-weight:800;color:var(--dark);background:var(--gold);transition:all .2s;white-space:nowrap}
.manual-btn:hover{background:var(--gold);transform:translateY(-1px)}

/* RESULT OVERLAY */
.result-overlay{display:none;position:fixed;inset:0;z-index:100;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.result-overlay.show{display:flex}
.result-card{width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:32px 24px 40px;animation:slideUp .4s ease both;position:relative}
.result-card.valid{background:#f0fdf4}
.result-card.invalid{background:#fef2f2}
.result-card.checked{background:#fffbeb}
.result-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:var(--text-light)}
.result-icon{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 16px;animation:bounceIn .5s ease both}
.result-card.valid .result-icon{background:#dcfce7;color:#16a34a}
.result-card.invalid .result-icon{background:#fee2e2;color:var(--red)}
.result-card.checked .result-icon{background:#fef3c7;color:#b45309}
.result-title{font-family:var(--display);font-size:1.3rem;text-align:center;margin-bottom:4px}
.result-card.valid .result-title{color:#16a34a}
.result-card.invalid .result-title{color:var(--red)}
.result-card.checked .result-title{color:#b45309}
.result-subtitle{font-size:.78rem;color:var(--text-light);text-align:center;margin-bottom:20px}
.result-details{background:var(--white);border-radius:var(--radius-sm);padding:16px;margin-bottom:16px;border:1px solid rgba(0,0,0,.06)}
.rd-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.82rem}
.rd-row:not(:last-child){border-bottom:1px solid rgba(0,0,0,.04)}
.rd-label{color:var(--text-light);font-weight:600}
.rd-val{font-weight:800;color:var(--dark)}
.rd-val.mono{font-family:'Courier New',monospace;letter-spacing:.08em}
.result-badge{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:800;padding:4px 10px;border-radius:100px;letter-spacing:.02em}
.badge-confirmed{color:var(--blue);background:var(--blue-light)}
.badge-pending{color:#b45309;background:rgba(180,83,9,.08)}
.badge-paid{color:#16a34a;background:rgba(22,163,74,.08)}
.badge-unpaid{color:var(--red);background:var(--red-light)}
.result-actions{display:flex;gap:8px}
.ra-btn{flex:1;padding:14px;border-radius:14px;font-size:.82rem;font-weight:800;text-align:center;cursor:pointer;transition:all .2s}
.ra-btn.checkin{color:var(--white);background:var(--green);box-shadow:0 4px 16px rgba(37,211,102,.25)}
.ra-btn.checkin:hover{box-shadow:0 8px 24px rgba(37,211,102,.35)}
.ra-btn.whatsapp{color:var(--green);background:var(--green-light);border:1.5px solid rgba(37,211,102,.15)}
.ra-btn.close-btn{color:var(--text-light);background:rgba(0,0,0,.04)}

/* SCAN HISTORY */
.history{width:100%;max-width:340px;margin-bottom:40px}
.history-title{font-size:.68rem;font-weight:800;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.history-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:4px;border:1px solid rgba(255,255,255,.04)}
.hi-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.hi-dot.valid{background:#16a34a}
.hi-dot.invalid{background:var(--red)}
.hi-dot.checked{background:#b45309}
.hi-ref{font-family:monospace;font-size:.78rem;font-weight:800;color:var(--white)}
.hi-status{font-size:.6rem;font-weight:800;margin-left:4px}
.hi-status.valid{color:#16a34a}
.hi-status.invalid{color:var(--red)}
.hi-status.checked{color:#b45309}
.hi-time{font-size:.6rem;color:rgba(255,255,255,.25);margin-left:auto}
.hi-mode{font-size:.55rem;color:rgba(255,255,255,.2);background:rgba(255,255,255,.06);padding:2px 6px;border-radius:4px;margin-left:6px}
.empty-hist{text-align:center;padding:20px;color:rgba(255,255,255,.2);font-size:.78rem}

/* FOOTER */
.scan-footer{text-align:center;padding:20px;font-size:.65rem;color:rgba(255,255,255,.2)}
.scan-footer a{color:var(--gold)}

@media(min-width:600px){
  .scanner-area{max-width:380px}
  .manual-section,.history{max-width:380px}
}
</style>
</head>

  <!-- SCANNER AREA -->

    <div class="scanner-corners"></div>
    <div class="scanner-corners2"></div>
    <div class="scan-line" id="scanLine" style="display:none"></div>
  </div>

  <!-- MANUAL ENTRY -->
  <div class="manual-section">
    <div class="manual-title" data-i18n="manual_title">Oswa antre kòd la manyèlman</div>
    <div class="manual-row">
      <input type="text" class="manual-input" id="manualRef" placeholder="REF-XXXXXX" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')validateRef()">
      <button class="manual-btn" onclick="validateRef()" data-i18n="btn_verify">Verifye</button>
    </div>
  </div>

  <!-- SCAN HISTORY -->
  <div class="history">
    <div class="history-title" data-i18n="history_title">Ist&ograve;rik Eskanaj</div>
    <div id="historyList"><div class="empty-hist" data-i18n="empty_hist">Pa gen eskanaj ank&ograve;</div></div>
  </div>

</div>

<!-- RESULT OVERLAY -->
<div class="result-overlay" id="resultOverlay" onclick="if(event.target===this)closeResult()">
  <div class="result-card" id="resultCard"></div>
</div>

<div class="scan-footer">

function tx(k){return(T[currentLang]||T.ht)[k]||(T.ht)[k]||k}
function setLang(l){
  currentLang=l;
  document.querySelectorAll('.h-lang a').forEach(function(a){a.classList.remove('active')});
  var el=document.getElementById('lang-'+l);if(el)el.classList.add('active');
  var tr=T[l]||T.ht;
  document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(tr[k])el.innerHTML=tr[k]});
}

/* MODE */
function setMode(m){
  scanMode=m;
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.mode-tab[data-mode="'+m+'"]').classList.add('active');
}

/* CAMERA */
function startCamera(){
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(stream){
      cameraStream=stream;
      var video=document.getElementById('cameraFeed');
      video.srcObject=stream;
      video.classList.add('active');
      document.getElementById('cameraPlaceholder').classList.add('hide');
      document.getElementById('scanLine').style.display='block';
    }).catch(function(){
      alert('Kamera pa disponib. Sèvi ak antre manyèl.');
    });
  } else {
    alert('Kamera pa sipòte nan navigatè sa a.');
  }
}

/* VALIDATE */
function validateRef(){
  var ref=document.getElementById('manualRef').value.trim().toUpperCase();
  if(!ref)return;
  var res=DEMO_RESERVATIONS[ref];
  showResult(ref,res);
  document.getElementById('manualRef').value='';
}

function showResult(ref,res){
  var card=document.getElementById('resultCard');
  var overlay=document.getElementById('resultOverlay');
  var now=new Date().toLocaleTimeString();
  var html='';

  if(!res){
    card.className='result-card invalid';
    html+='<div class="result-close" onclick="closeResult()">&#10005;</div>';
    html+='<div class="result-icon">&#10060;</div>';
    html+='<div class="result-title">'+tx('invalid_title')+'</div>';
    html+='<div class="result-subtitle">'+tx('invalid_sub')+'</div>';
    html+='<div class="result-details"><div class="rd-row"><span class="rd-label">REF</span><span class="rd-val mono">'+ref+'</span></div></div>';
    html+='<div class="result-actions"><button class="ra-btn close-btn" onclick="closeResult()">'+tx('btn_close')+'</button></div>';
    addHistory(ref,'invalid',now);
  } else if(res.status==='cancelled'){
    card.className='result-card invalid';
    html+='<div class="result-close" onclick="closeResult()">&#10005;</div>';
    html+='<div class="result-icon">&#128683;</div>';
    html+='<div class="result-title">'+tx('expired_title')+'</div>';
    html+='<div class="result-subtitle">'+tx('expired_sub')+'</div>';
    html+='<div class="result-details">'+buildDetails(res)+'</div>';
    html+='<div class="result-actions"><button class="ra-btn close-btn" onclick="closeResult()">'+tx('btn_close')+'</button></div>';
    addHistory(ref,'invalid',now);
  } else if(res.checkedIn){
    card.className='result-card checked';
    html+='<div class="result-close" onclick="closeResult()">&#10005;</div>';
    html+='<div class="result-icon">&#9888;&#65039;</div>';
    html+='<div class="result-title">'+tx('already_title')+'</div>';
    html+='<div class="result-subtitle">'+tx('already_sub')+'</div>';
    html+='<div class="result-details">'+buildDetails(res)+'</div>';
    html+='<div class="result-actions"><button class="ra-btn close-btn" onclick="closeResult()">'+tx('btn_close')+'</button></div>';
    addHistory(ref,'checked',now);
  } else {
    card.className='result-card valid';
    var actionLabel=tx('btn_validate');
    if(scanMode==='boarding')actionLabel=tx('btn_board');
    else if(scanMode==='checkin')actionLabel=tx('btn_checkin');
    else if(scanMode==='event')actionLabel=tx('btn_admit');

    html+='<div class="result-close" onclick="closeResult()">&#10005;</div>';
    html+='<div class="result-icon">&#9989;</div>';
    html+='<div class="result-title">'+tx('valid_title')+'</div>';
    html+='<div class="result-subtitle">'+res.operator+'</div>';
    html+='<div class="result-details">'+buildDetails(res)+'</div>';
    html+='<div class="result-actions">';
    html+='<button class="ra-btn checkin" onclick="markCheckedIn(\''+ref+'\')">&#9989; '+actionLabel+'</button>';
    html+='<button class="ra-btn whatsapp" onclick="waContact(\''+ref+'\')">&#128172; '+tx('btn_whatsapp')+'</button>';
    html+='</div>';
    addHistory(ref,'valid',now);
  }

  card.innerHTML=html;
  overlay.classList.add('show');
}

function buildDetails(res){
  var h='';
  h+='<div class="rd-row"><span class="rd-label">REF</span><span class="rd-val mono">'+res.ref+'</span></div>';
  h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_passenger')+'</span><span class="rd-val">'+res.customer+'</span></div>';
  h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_phone')+'</span><span class="rd-val">'+res.phone+'</span></div>';
  if(res.route)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_route')+'</span><span class="rd-val">'+res.route+'</span></div>';
  if(res.seat)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_seat')+'</span><span class="rd-val" style="font-size:1.1rem;font-weight:900">'+res.seat+'</span></div>';
  if(res.room)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_room')+'</span><span class="rd-val">'+res.room+'</span></div>';
  if(res.hotel)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_hotel')+'</span><span class="rd-val">'+res.hotel+'</span></div>';
  if(res.event)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_event')+'</span><span class="rd-val">'+res.event+'</span></div>';
  if(res.venue)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_venue')+'</span><span class="rd-val">'+res.venue+'</span></div>';
  if(res.service)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_service')+'</span><span class="rd-val">'+res.service+'</span></div>';
  if(res.pax)h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_pax')+'</span><span class="rd-val">'+res.pax+'</span></div>';
  h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_date')+'</span><span class="rd-val">'+(res.date||res.checkin||'-')+'</span></div>';
  h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_amount')+'</span><span class="rd-val" style="font-weight:900">'+res.amount.toLocaleString()+' HTG</span></div>';
  h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_status')+'</span><span class="rd-val"><span class="result-badge '+(res.status==='confirmed'?'badge-confirmed':'badge-pending')+'">'+tx('s_'+res.status)+'</span></span></div>';
  h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_payment')+'</span><span class="rd-val"><span class="result-badge '+(res.paid?'badge-paid':'badge-unpaid')+'">'+(res.paid?tx('paid'):tx('unpaid'))+'</span></span></div>';
  h+='<div class="rd-row"><span class="rd-label">'+tx('lbl_pin')+'</span><span class="rd-val mono" style="font-size:1.2rem">'+res.pin+'</span></div>';
  return h;
}

function markCheckedIn(ref){
  if(DEMO_RESERVATIONS[ref]){
    DEMO_RESERVATIONS[ref].checkedIn=true;
    DEMO_RESERVATIONS[ref].status='completed';
  }
  closeResult();
  var idx=scanHistory.findIndex(function(h){return h.ref===ref&&h.status==='valid'});
  if(idx>=0)scanHistory[idx].status='checked';
  renderHistory();
}

function waContact(ref){
  var res=DEMO_RESERVATIONS[ref];
  if(!res)return;
  var msg='Bonjou '+res.customer+'! Rezèvasyon ou '+res.ref+' verifye. Mèsi!\n(via TouPaTou)';
  window.open('https://wa.me/'+res.phone.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msg),'_blank');
}

function closeResult(){document.getElementById('resultOverlay').classList.remove('show')}

/* HISTORY */
function addHistory(ref,status,time){
  scanHistory.unshift({ref:ref,status:status,time:time,mode:scanMode});
  if(scanHistory.length>15)scanHistory=scanHistory.slice(0,15);
  renderHistory();
}
function renderHistory(){
  var list=document.getElementById('historyList');
  if(scanHistory.length===0){list.innerHTML='<div class="empty-hist">'+tx('empty_hist')+'</div>';return}
  var html='';
  scanHistory.forEach(function(h){
    var label=h.status==='valid'?'VALID':h.status==='checked'?'CHECKED':'INVALID';
    html+='<div class="history-item"><div class="hi-dot '+h.status+'"></div><span class="hi-ref">'+h.ref+'</span><span class="hi-status '+h.status+'">'+label+'</span><span class="hi-mode">'+h.mode+'</span><span class="hi-time">'+h.time+'</span></div>';
  });
  list.innerHTML=html;
}

/* INIT */
(function(){setLang('ht')})();
