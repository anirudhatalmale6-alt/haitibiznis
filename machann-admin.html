<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Machann MyPlopPlop — Konsòl</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* 4 Nov 2026 (Jeffery, "MYPLOPPLOP — YES, APPROVED"): Jennifer verifies the businesses Ajans register from
   LajanMaker, like the MsouWout drivers (chofe-admin.html). Everything goes through the HaitiBiznis server
   (her console code is checked there) to MyPlopPlop, server to server. Every decision carries her name.
   The owner's ID photo is shown ONLY here, never on the public store. */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:light;--navy:#0B2E6F;--red:#D21034;--green:#16803A;--ink:#152341;--muted:#5A6B8A;--line:#E2E8F0;--off:#F3F6FB}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--off);color:var(--ink);min-height:100vh}
button,input,select,textarea{font-family:inherit}
.flag{height:4px;background:linear-gradient(90deg,var(--navy) 50%,var(--red) 50%)}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}
.top b{font-size:1.05rem}.top small{color:var(--muted);display:block;font-size:.8rem}
.w{max-width:760px;margin:0 auto;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.95rem;background:#fff}
.mono{font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.btn{min-height:40px;border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:.84rem;cursor:pointer;background:var(--navy);color:#fff}
.btn.g{background:var(--green)}.btn.r{background:var(--red)}.btn.o{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn:disabled{opacity:.55;cursor:default}
.full{width:100%;margin-top:12px;min-height:46px}
.hide{display:none}
.fbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.fl{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 11px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--ink);min-height:38px}
.chips button b{margin-left:4px;color:var(--muted)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}.chips button.on b{color:#fff}
.chips button.z{opacity:.45}
.fres{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:800;font-size:.9rem}
.m{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.m .n{font-weight:800;font-size:1.02rem}
.st{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.st.pending{background:#FFF3D6;color:#8A5A00}.st.fix{background:#FFE9D6;color:#9A4A00}.st.approved{background:#E2F4E8;color:#11632C}
.st.rejected{background:#FDE7EA;color:#A30F27}.st.legacy{background:#E8EEF8;color:#0B2E6F}
.meta{font-size:.86rem;color:var(--muted);margin-top:8px;line-height:1.6}.meta b{color:var(--ink)}
.ajan{margin-top:8px;font-size:.86rem;font-weight:700;border-radius:10px;padding:8px 10px}
.ajan.ok{background:#E2F4E8;color:#11632C}.ajan.no{background:#FFF3D6;color:#8A5A00}
.fixb{background:#FFF3D6;color:#8A5A00;border-radius:10px;padding:8px 10px;font-weight:800;font-size:.85rem;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.panel{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:8px}.panel.open{display:block}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.docs .d{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted)}
.docs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:4px;cursor:zoom-in}
.docs .miss{aspect-ratio:4/3;border:2px dashed #F2A7A7;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#A30F27;font-weight:800;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 0;font-size:.86rem}
.msg{font-size:.86rem;margin-top:8px;font-weight:700}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
#viewer.on{display:flex}#viewer .vs{width:100%;flex:1;overflow:auto;display:flex;align-items:center;justify-content:center}
#viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff;cursor:zoom-in}
#viewer .vs.z{display:block}#viewer .vs.z img{max-width:none;max-height:none;width:260%;cursor:zoom-out}
#viewer .vt{color:#fff;font-weight:800;margin:10px 0}
#viewer button{border:0;border-radius:12px;padding:12px 18px;font-weight:800;font-size:1rem;background:#fff;color:#111}
.priv{font-size:.75rem;color:#8A5A00;font-weight:700;margin-top:6px}
</style>
</head>
<body>
<div class="flag"></div>
<div class="top"><div class="w" style="padding:0"><b>Machann MyPlopPlop — Konsòl</b><small>Verifye biznis Ajan yo enskri: enfòmasyon, foto magazen ak pyès idantite pwopriyetè a. Magazen an parèt piblik sèlman lè ou apwouve l.</small></div></div>
<div class="w">
  <div class="box" id="gate">
    <label for="pin">Kòd konsòl la</label>
    <input id="pin" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CONSOLE CODE">
    <label for="who">Non ou (li parèt sou chak desizyon)</label>
    <input id="who" autocomplete="name" placeholder="Egz: Jennifer">
    <button class="btn full" id="open">Louvri</button>
    <div class="msg err" id="gateMsg"></div>
  </div>
  <div id="main" class="hide">
    <div class="fbar">
      <input id="fq" type="search" placeholder="🔎 Chèche: biznis, pwopriyetè, telefòn, kòd Ajan" autocomplete="off">
      <div class="fl">Estati</div><div class="chips" id="fSt"></div>
      <div class="fres"><span id="fN"></span><button type="button" class="btn o" id="reload" style="min-height:32px">🔄</button></div>
    </div>
    <div id="list"></div>
  </div>
</div>
<div id="viewer" role="dialog" aria-modal="true"><div class="vs" id="vS"><img id="vImg" alt=""></div><div class="vt" id="vName"></div><button type="button" id="vX">✕ Fèmen</button></div>
<script>
(function(){
  'use strict';
  var API = 'https://haitibiznis-api.onrender.com', MPP_SITE = 'https://myplopplop.com';
  var pin = '', who = '', all = [], F = { st: 'pending', q: '' };
  function $(id){ return document.getElementById(id); }
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(d){ try { return new Date(d).toLocaleString('fr-HT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch(e){ return ''; } }
  try { who = localStorage.getItem('hb_console_who') || ''; } catch(e){}
  $('who').value = who;
  try { var sp = sessionStorage.getItem('hb_console_pin'); if (sp) { $('pin').value = sp; setTimeout(function(){ if (who) $('open').click(); }, 0); } } catch(e){}
  try { var sf = JSON.parse(sessionStorage.getItem('hb_machann_f') || 'null'); if (sf) F = Object.assign(F, sf); } catch(e){}

  var ERR = { link_unavailable: 'Koneksyon ak MyPlopPlop pa disponib pou kounye a. Eseye ankò nan yon minit.',
    name_required: 'Mete non ou anvan.', reason_required: 'Mete rezon an.', docs_required: 'Chwazi sa pou korije a.',
    missing_documents: 'Foto ki manke: ', corrections_pending: 'Gen korije ki poko fèt.', not_pending: 'Biznis sa a pa an atant.',
    already_sent: 'Mesaj byenveni an deja anrejistre.', bad_image: 'Foto a pa bon.', too_large: 'Foto a twò gwo.' };
  var DOC = { storefront: '🏪 Foto magazen', owner_id: '🪪 Pyès idantite pwopriyetè a', info: '📝 Enfòmasyon' };
  function req(method, path, body){
    var o = { method: method, headers: { 'x-admin-pin': pin } };
    if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
    return fetch(API + path, o).then(function(r){
      if (r.status === 403) { var e = new Error('Kòd konsòl la pa bon.'); e.pin = true; throw e; }
      return r.json().catch(function(){ return {}; }).then(function(d){
        if (!r.ok) { var m = ERR[d.error] || d.error || ('Erè ' + r.status); if (d.error === 'missing_documents') m += (d.missing || []).map(function(t){ return DOC[t] || t; }).join(', ');
          var e = new Error(m); e.data = d; throw e; } return d; });
    });
  }
  $('open').onclick = function(){
    pin = $('pin').value.trim(); who = $('who').value.trim();
    if (!pin) return; if (!who) { $('gateMsg').textContent = 'Mete non ou.'; return; }
    try { localStorage.setItem('hb_console_who', who); } catch(e){}
    $('open').disabled = true; $('gateMsg').textContent = 'Ap louvri… (premye fwa a ka pran 1 minit)';
    load().then(function(){ $('gate').classList.add('hide'); $('main').classList.remove('hide'); try { sessionStorage.setItem('hb_console_pin', pin); } catch(e){} })
      .catch(function(e){ $('gateMsg').textContent = e.message; })
      .then(function(){ $('open').disabled = false; });
  };
  $('reload').onclick = function(){ load().catch(function(e){ alert(e.message); }); };
  function load(){ return req('GET', '/api/agents/admin/merchants').then(function(d){ all = d.merchants || []; render(); }); }

  /* every business counted once in each category it belongs to */
  var ST = [['pending', '⏳ An atant'], ['fix', '🔧 Korije'], ['approved', '✅ Apwouve'], ['active', '🟢 Aktif'], ['rejected', '❌ Rejte'], ['legacy', '🗂️ Ansyen magazen'], ['all', '📋 Tout']];
  function mSt(m, st){ return st === 'all' || (st === 'active' ? m.status === 'active' : m.state === st); }
  function mQ(m, q){ if (!q) return true; var t = q.toLowerCase(), d = q.replace(/\D/g, '');
    var hay = [m.name, m.owner && m.owner.name, m.agentCode, m.agentName, m.category, m.address].join(' ').toLowerCase();
    return hay.indexOf(t) >= 0 || (d.length >= 3 && (String(m.phone).replace(/\D/g, '').indexOf(d) >= 0 || String(m.owner && m.owner.phone).replace(/\D/g, '').indexOf(d) >= 0)); }
  function cnt(st){ return all.filter(function(m){ return mSt(m, st) && mQ(m, F.q); }).length; }
  $('fSt').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; F.st = b.getAttribute('data-st'); save(); render(); load().catch(function(){}); };
  var qT; $('fq').oninput = function(){ var v = this.value; clearTimeout(qT); qT = setTimeout(function(){ F.q = v.trim(); save(); render(); }, 200); };
  function save(){ try { sessionStorage.setItem('hb_machann_f', JSON.stringify(F)); } catch(e){} }

  var LBL = { pending: '⏳ AN ATANT', fix: '🔧 POU KORIJE', approved: '✅ APWOUVE', rejected: '❌ REJTE', legacy: '🗂️ ANSYEN' };
  function render(){
    $('fSt').innerHTML = ST.map(function(x){ var n = cnt(x[0]); return '<button type="button" data-st="' + x[0] + '" class="' + (F.st === x[0] ? 'on' : '') + (n ? '' : ' z') + '">' + x[1] + '<b>' + n + '</b></button>'; }).join('');
    if ($('fq').value !== F.q) $('fq').value = F.q;
    var L = all.filter(function(m){ return mSt(m, F.st) && mQ(m, F.q); });
    var unrev = all.filter(function(m){ return m.state === 'legacy' && !(m.review && m.review.state); }).length;
    $('fN').textContent = '📋 ' + L.length + ' biznis' + (F.st === 'legacy' ? ' · ' + unrev + ' poko revize' : '');
    $('list').innerHTML = L.map(card).join('') || '<div class="box">Pa gen biznis isit la.</div>';
    $('list').querySelectorAll('[data-a]').forEach(function(b){ b.onclick = function(){ act(b.getAttribute('data-id'), b.getAttribute('data-a'), b); }; });
  }
  function card(m){
    var id = esc(m.id), st = m.state;
    var docs = ['storefront', 'owner_id'].map(function(t){ return (m.docs || []).indexOf(t) >= 0 ? '✅ ' + DOC[t] : '<b style="color:#A30F27">⚠️ ' + DOC[t] + ' manke</b>'; }).join(' · ');
    var aj = m.agentCode ? '<div class="ajan ok">🪪 Ajan: ' + esc(m.agentName ? m.agentName + ' · ' : '') + esc(m.agentCode) + '</div>'
           : (st === 'legacy' ? '' : '<div class="ajan no">⚠️ Pa gen kòd Ajan</div>');
    var a = '<button class="btn o" data-a="docs" data-id="' + id + '">📷 Dosye / foto</button>';
    if (st === 'pending') a += '<button class="btn g" data-a="approve" data-id="' + id + '">✅ Apwouve</button>';
    if (st === 'pending' || st === 'fix') a += '<button class="btn o" data-a="fix" data-id="' + id + '">🔧 Mande korije</button><button class="btn r" data-a="reject" data-id="' + id + '">⛔ Rejte</button>';
    if (st === 'fix' && (m.fixDocs || []).indexOf('info') >= 0) a += '<button class="btn o" data-a="fixdone" data-id="' + id + '">✔️ Enfòmasyon yo korije</button>';
    if (st === 'rejected') a += '<button class="btn o" data-a="reopen" data-id="' + id + '">↩️ Remete an atant</button>';
    if (st === 'approved') a += '<a class="btn o" style="text-decoration:none;background:#25D366;color:#fff;border-color:#25D366;display:inline-flex;align-items:center" data-wel="' + id + '" target="_blank" rel="noopener" href="' + waLink(m) + '">📲 ' + (m.welcomeAt ? 'Voye byenveni ankò' : 'Voye mesaj byenveni') + '</a>';
    if (st === 'legacy' || st === 'approved') a += '<button class="btn o" data-a="review" data-id="' + id + '">👁 Revize</button>';
    if (m.status === 'active' && m.slug) a += '<a class="btn o" style="text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="' + MPP_SITE + '/store.html?slug=' + encodeURIComponent(m.slug) + '">🌐 Wè magazen an</a>';
    a += '<button class="btn o" data-a="edit" data-id="' + id + '">✏️ Modifye</button><button class="btn o" data-a="hist" data-id="' + id + '">🕘 Istwa</button>';
    var rv = m.review && m.review.state ? '<div class="meta">👁 Revize pa ' + esc(m.review.by) + ' ' + esc(fmt(m.review.at)) + ': ' + (m.review.state === 'ok' ? '✅ OK' : '<b style="color:#A30F27">⚠️ Gen pwoblèm</b>') + (m.review.note ? ' — ' + esc(m.review.note) : '') + '</div>' : '';
    return '<div class="m" id="m_' + id + '"><div class="n">' + esc(m.name) + '<span class="st ' + esc(st) + '">' + (LBL[st] || st) + '</span>' + (m.status === 'active' ? '<span class="st approved">🟢 PIBLIK</span>' : '') + '</div>' +
      '<div class="meta">👤 <b>' + esc(m.owner ? m.owner.name : '—') + '</b> · 📞 <b>' + esc((m.owner && m.owner.phone) || m.phone || '—') + '</b><br>' +
        '🏷️ ' + esc(m.category) + ' · 📍 ' + esc(m.address || '—') + ' · 🗓️ ' + esc(fmt(m.createdAt)) + ' · 📦 ' + (m.products || 0) + ' pwodwi' +
        (st !== 'legacy' ? '<br>' + docs : '') + (m.decidedBy ? '<br>✍️ ' + esc(m.decidedBy) + ' · ' + esc(fmt(m.decidedAt)) : '') +
        (m.welcomeAt ? '<br>📨 Byenveni voye pa ' + esc(m.welcomeBy) + ' · ' + esc(fmt(m.welcomeAt)) : (st === 'approved' ? '<br><b style="color:#8A5A00">📨 Mesaj byenveni POKO VOYE</b>' : '')) +
        (st === 'rejected' && m.reason ? '<br>📝 ' + esc(m.reason) : '') + '</div>' + aj + rv +
      (st === 'fix' ? '<div class="fixb">🔧 Ap tann korije: ' + (m.fixDocs || []).map(function(t){ return DOC[t] || t; }).join(', ') + (m.fixNote ? ' — ' + esc(m.fixNote) : '') + '</div>' : '') +
      '<div class="acts">' + a + '</div><div class="panel" id="p_' + id + '"></div><div class="msg" id="g_' + id + '"></div></div>';
  }
  /* Jeffery: "a one-tap WhatsApp welcome message explaining how the merchant logs in, adds products, and manages orders" */
  function waLink(m){
    var ph = String((m.owner && m.owner.phone) || m.phone || '').replace(/\D/g, ''); if (ph.length === 8) ph = '509' + ph;
    var first = String((m.owner && m.owner.name) || '').split(' ')[0];
    var txt = '🎉 FELISITASYON ' + first + '! Biznis ou "' + m.name + '" APWOUVE sou MyPlopPlop. ✅\n\n' +
      '1️⃣ KONEKTE: ' + MPP_SITE + '/login.html → nimewo telefòn ou + PIN 4 chif Ajan an te ba ou a.\n\n' +
      '2️⃣ AJOUTE PWODWI: ' + MPP_SITE + '/merchant/products.html → ➕ Ajoute (foto, non, pri, kantite).\n\n' +
      '3️⃣ KÒMAND: ' + MPP_SITE + '/merchant/orders.html → aksepte kòmand yo epi make yo "PARE" lè yo pare pou kliyan an oswa chofè a.\n\n' +
      '🔗 Magazen ou: ' + MPP_SITE + '/store.html?slug=' + encodeURIComponent(m.slug || '') + '\n\n' +
      'Pa bay pèsonn PIN ou. Nenpòt kesyon: pale ak Ajan ou a.\nMyPlopPlop — Achte lokal.';
    return 'https://wa.me/' + ph + '?text=' + encodeURIComponent(txt);
  }
  document.addEventListener('click', function(ev){
    var a = ev.target.closest && ev.target.closest('a[data-wel]'); if (!a) return;
    var id = a.getAttribute('data-wel');
    req('POST', '/api/agents/admin/merchants/' + id + '/welcome', { by: who })
      .then(function(){ setTimeout(load, 800); }).catch(function(){ /* already recorded once */ });
  });
  function say(id, t, ok){ var m = $('g_' + id); if (!m) return; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; }
  function find(id){ return all.filter(function(m){ return m.id === id; })[0]; }
  function shrink(file){ return new Promise(function(res){ var u = URL.createObjectURL(file), im = new Image();
    im.onload = function(){ var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', 0.85)); };
    im.onerror = function(){ URL.revokeObjectURL(u); res(null); }; im.src = u; }); }
  function pick(id, type){
    var f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
    f.onchange = function(){ var file = f.files && f.files[0]; if (!file) return; say(id, 'Ap voye foto a…', true);
      shrink(file).then(function(u){ if (!u) throw new Error('Foto a pa bon.'); return req('POST', '/api/agents/admin/merchants/' + id + '/document', { by: who, type: type, image_data: u }); })
        .then(function(){ say(id, '✅ ' + DOC[type] + ' anrejistre.', true); setTimeout(load, 700); })
        .catch(function(e){ say(id, e.message, false); }); };
    f.click();
  }
  function act(id, a, btn){
    var m = find(id), p = $('p_' + id); if (!m) return;
    if (a === 'docs' || a === 'hist') {
      if (p.classList.contains('open') && p.getAttribute('data-k') === a) { p.classList.remove('open'); return; }
      p.setAttribute('data-k', a); p.classList.add('open'); p.innerHTML = '<div class="meta">Ap chaje…</div>';
      req('GET', '/api/agents/admin/merchants/' + id).then(function(x){
        if (!x || !x.merchant || !Array.isArray(x.documents)) throw new Error('Dosye a pa t ka chaje (koneksyon). Eseye ankò.');
        if (a === 'hist') {
          p.innerHTML = '<b>🕘 Istwa</b>' + ((x.history || []).slice().reverse().map(function(h){ return '<div class="row"><span>' + esc(fmt(h.at)) + ' · ' + esc(String(h.by || '').replace(/^console:/, '')) + '</span><span>' + esc(h.action) + (h.note ? ' — ' + esc(h.note) : '') + '</span></div>'; }).join('') || '<div class="meta">Pa gen anyen.</div>');
          return;
        }
        var by = {}; x.documents.forEach(function(d){ by[d.type] = d; });
        var waiting = ['pending', 'fix'].indexOf(m.state) >= 0;
        var rows = ['storefront', 'owner_id'].map(function(t){ var d = by[t], fx = (m.fixDocs || []).indexOf(t) >= 0;
          return '<div class="row"><b>' + DOC[t] + '</b><span>' + (fx ? '<b style="color:#8A5A00">🔧 Ou mande refè l</b>' : d ? '<b style="color:#11632C">✅ Resevwa</b> ' + esc(fmt(d.at)) + (d.by ? ' · ' + esc(String(d.by).replace(/^console:/, '').replace(/^ajan:/, 'Ajan ')) : '') : '<b style="color:#A30F27">⚠️ MANKE</b> — poko rive (si Ajan an te pran l: li dwe peze "🔄 Voye dokiman ki rete yo")') + '</span></div>'; }).join('');
        p.innerHTML = (m.state === 'legacy' ? '<div class="meta">Magazen sa a te kreye anvan 4 nov: li pa gen dosye verifikasyon. Ou ka "👁 Revize" l san ou pa fèmen l.</div>' : '<div class="box" style="padding:10px 12px;margin:0 0 10px"><b>📋 Dosye biznis la</b>' + rows + '</div>') +
          '<div class="docs">' + ['storefront', 'owner_id'].map(function(t){ var d = by[t];
            return '<div class="d">' + (d ? '<img data-v="' + t + '" src="' + d.data_url + '" alt="">' : '<div class="miss">⚠️ Manke</div>') + DOC[t] +
              (waiting ? '<br><button type="button" class="btn o" style="margin-top:6px;min-height:34px" data-p="' + t + '">📷 ' + (d ? 'Ranplase' : 'Ajoute') + '</button>' : '') + '</div>'; }).join('') + '</div>' +
          '<div class="priv">🔒 Pyès idantite a prive: li parèt sèlman isit la, janm sou magazen piblik la.</div>';
        p.querySelectorAll('img[data-v]').forEach(function(im){ im.onclick = function(){ $('vImg').src = im.src; $('vName').textContent = DOC[im.getAttribute('data-v')] + ' · peze pou grandi'; $('vS').classList.remove('z'); $('viewer').classList.add('on'); }; });
        p.querySelectorAll('[data-p]').forEach(function(b){ b.onclick = function(){ pick(id, b.getAttribute('data-p')); }; });
      }).catch(function(e){ p.setAttribute('data-k', 'err'); p.innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
      return;
    }
    if (a === 'approve') {
      if (!confirm('Apwouve "' + m.name + '"? Magazen an ap parèt PIBLIK sou MyPlopPlop epi l ap ka resevwa kòmand.')) return;
      return post(id, 'approve', {}, '✅ Apwouve: magazen an piblik kounye a. Voye mesaj byenveni an.');
    }
    if (a === 'reject') { var why = prompt('Rezon an (ap parèt pou Ajan an):'); if (!why) return; return post(id, 'reject', { reason: why.trim() }, '⛔ Rejte.'); }
    if (a === 'reopen') return post(id, 'reopen', {}, '↩️ Remete an atant.');
    if (a === 'fixdone') return post(id, 'fix-done', {}, '✔️ Anrejistre.');
    if (a === 'fix') {
      p.setAttribute('data-k', 'fix'); p.classList.add('open');
      p.innerHTML = '<label>Kisa pou korije?</label>' + ['storefront', 'owner_id', 'info'].map(function(t){ return '<label style="display:flex;gap:8px;align-items:center;font-weight:700;color:var(--ink)"><input type="checkbox" value="' + t + '" style="width:20px;height:20px;min-height:0"> ' + DOC[t] + '</label>'; }).join('') +
        '<label>Nòt pou Ajan an</label><input id="fn_' + id + '" placeholder="Egz: foto a twò flou"><button class="btn full" id="fg_' + id + '">🔧 Voye demann lan</button>';
      $('fg_' + id).onclick = function(){ var ds = [].slice.call(p.querySelectorAll('input[type=checkbox]:checked')).map(function(c){ return c.value; });
        post(id, 'fix', { docs: ds, note: $('fn_' + id).value.trim() }, '🔧 Demann korije voye. Ajan an ap wè l nan app li.'); };
      return;
    }
    /* Jeffery 4 Nov: "Jennifer must be able to correct basic merchant information" - logged old → new */
    if (a === 'edit') {
      p.setAttribute('data-k', 'edit'); p.classList.add('open');
      var CAT = ['restaurant', 'supermarket', 'hardware', 'pharmacy', 'wholesale', 'retail', 'bakery', 'other'];
      var FD = [['name', 'Non biznis la', m.name], ['ownerName', 'Non pwopriyetè a', m.owner ? m.owner.name : ''], ['phone', 'Telefòn biznis la', m.phone], ['address', 'Adrès', m.address], ['description', 'Deskripsyon', m.description]];
      p.innerHTML = FD.map(function(f){ return '<label>' + f[1] + '</label>' + (f[0] === 'description' ? '<textarea data-ef="description" rows="3">' + esc(f[2]) + '</textarea>' : '<input data-ef="' + f[0] + '" value="' + esc(f[2]) + '">'); }).join('') +
        '<label>Kategori</label><select data-ef="category">' + CAT.map(function(c){ return '<option' + (c === m.category ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
        '<button class="btn full" id="eg_' + id + '">💾 Anrejistre chanjman yo</button>';
      $('eg_' + id).onclick = function(){ var b = {}; p.querySelectorAll('[data-ef]').forEach(function(el){ b[el.getAttribute('data-ef')] = el.value; });
        post(id, 'edit', b, '✅ Chanjman yo anrejistre (yo parèt nan 🕘 Istwa).'); };
      return;
    }
    if (a === 'review') {
      p.setAttribute('data-k', 'review'); p.classList.add('open');
      p.innerHTML = '<div class="meta">Revizyon sa a pa fèmen magazen an: se yon nòt pou ou sèlman.</div><label>Nòt</label><input id="rn_' + id + '" placeholder="Egz: telefòn verifye, magazen egziste">' +
        '<div class="acts"><button class="btn g" id="rk_' + id + '">✅ Revize: OK</button><button class="btn r" id="rf_' + id + '">⚠️ Gen pwoblèm</button></div>';
      $('rk_' + id).onclick = function(){ post(id, 'review', { state: 'ok', note: $('rn_' + id).value.trim() }, '✅ Revizyon anrejistre.'); };
      $('rf_' + id).onclick = function(){ post(id, 'review', { state: 'flag', note: $('rn_' + id).value.trim() }, '⚠️ Anrejistre (magazen an rete jan l ye).'); };
    }
  }
  function post(id, act, body, okMsg){
    return req('POST', '/api/agents/admin/merchants/' + id + '/' + act, Object.assign({ by: who }, body))
      .then(function(){ say(id, okMsg, true); setTimeout(load, 900); })
      .catch(function(e){ say(id, e.message, false); });
  }
  $('vX').onclick = function(){ $('viewer').classList.remove('on'); $('vImg').src = ''; };
  $('vImg').onclick = function(){ $('vS').classList.toggle('z'); };
  setInterval(function(){ if (pin && !document.hidden && !document.querySelector('#list .panel.open') && !$('viewer').classList.contains('on')) load().catch(function(){}); }, 60000);
})();
</script>
</body>
